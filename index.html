فاتحة",arti:"Pembukaan",jumlahAyat:7,tempatTurun:"Makkah (Makkiyah)",urutan:1,ayat:[{nomor:1,arab:"بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ",latin:"Bismillāhir-raḥmānir-raḥīm",terjemahan:"Dengan nama Allah Yang Maha Pengasih, Maha Penyayang."},{nomor:2,arab:"الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",latin:"Al-ḥamdu lillāhi rabbil-'ālamīn",terjemahan:"Segala puji bagi Allah, Tuhan seluruh alam."},{nomor:3,arab:"الرَّحْمَٰنِ الرَّحِيمِ",latin:"Ar-raḥmānir-raḥīm",terjemahan:"Yang Maha Pengasih, Maha Penyayang."},{nomor:4,arab:"مَالِكِ يَوْمِ الدِّينِ",latin:"Māliki yaumid-dīn",terjemahan:"Pemilik hari pembalasan."},{nomor:5,arab:"إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ",latin:"Iyyāka na'budu wa iyyāka nasta'īn",terjemahan:"Hanya kepada Engkaulah kami menyembah dan hanya kepada Engkaulah kami mohon pertolongan."},{nomor:6,arab:"اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ",latin:"Ihdinaṣ-ṣirāṭal-mustaqīm",terjemahan:"Tunjukkanlah kami jalan yang lurus."},{nomor:7,arab:"صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ",latin:"Ṣirāṭallażīna an'amta 'alaihim ghairil-maghḍūbi 'alaihim wa laḍ-ḍāllīn",terjemahan:"(yaitu) jalan orang-orang yang telah Engkau beri nikmat kepadanya; bukan (jalan) mereka yang dimurkai, dan bukan (pula jalan) mereka yang sesat."}],kosaKata:[{arab:"بِسْمِ",latin:"Bismi",arti:"Dengan nama"},{arab:"اللَّهِ",latin:"Allah",arti:"Allah"},{arab:"الرَّحْمَٰنِ",latin:"Ar-Rahman",arti:"Yang Maha Pengasih"},{arab:"الرَّحِيمِ",latin:"Ar-Rahim",arti:"Yang Maha Penyayang"},{arab:"الْحَمْدُ",latin:"Al-Hamdu",arti:"Segala puji"},{arab:"رَبِّ",latin:"Rabbi",arti:"Tuhan"},{arab:"الْعَالَمِينَ",latin:"Al-'Alamin",arti:"Seluruh alam"},{arab:"مَالِكِ",latin:"Maliki",arti:"Pemilik/Penguasa"},{arab:"يَوْمِ",latin:"Yaumi",arti:"Hari"},{arab:"الدِّينِ",latin:"Ad-Din",arti:"Pembalasan"},{arab:"نَعْبُدُ",latin:"Na'budu",arti:"Kami menyembah"},{arab:"نَسْتَعِينُ",latin:"Nasta'in",arti:"Kami mohon pertolongan"},{arab:"اهْدِنَا",latin:"Ihdina",arti:"Tunjukkanlah kami"},{arab:"الصِّرَاطَ",latin:"Ash-Shirat",arti:"Jalan"},{arab:"الْمُسْتَقِيمَ",latin:"Al-Mustaqim",arti:"Yang lurus"},{arab:"أَنْعَمْتَ",latin:"An'amta",arti:"Engkau beri nikmat"},{arab:"الْمَغْضُوبِ",latin:"Al-Maghdubi",arti:"Yang dimurkai"},{arab:"الضَّالِّينَ",latin:"Adh-Dhallin",arti:"Yang sesat"}],asbabunNuzul:`Surat Al-Fatihah merupakan surat yang pertama kali diturunkan secara lengkap. Para ulama berbeda pendapat mengenai waktu turunnya. Sebagian besar ulama berpendapat bahwa surat ini turun di Makkah sebelum hijrah, sehingga disebut Makkiyah.

Diriwayatkan bahwa ketika Rasulullah SAW sedang berada di Gua Hira, beliau mendengar suara yang memanggilnya. Beliau melihat ke kanan dan ke kiri, ke depan dan ke belakang, lalu ke atas, dan beliau melihat Malaikat Jibril duduk di antara langit dan bumi. Kemudian turunlah Al-Fatihah sebagai surat pembuka yang mengajarkan cara berdoa dan memuji Allah.

Surat ini juga disebut "Ummul Kitab" (Induk Al-Quran), "As-Sab'ul Matsani" (Tujuh Ayat yang Diulang-ulang), dan "Al-Hamd" karena dimulai dengan pujian kepada Allah.`,pelajaran:["Setiap aktivitas hendaknya dimulai dengan menyebut nama Allah (Bismillah)","Segala pujian hanya layak ditujukan kepada Allah sebagai Tuhan semesta alam","Allah memiliki sifat Maha Pengasih dan Maha Penyayang yang sempurna","Allah adalah penguasa mutlak hari pembalasan (kiamat)","Ibadah dan permohonan pertolongan hanya ditujukan kepada Allah semata (tauhid)","Pentingnya memohon hidayah dan petunjuk jalan yang lurus","Kita harus mengikuti jalan orang-orang yang diberi nikmat oleh Allah","Kita harus menghindari jalan orang-orang yang dimurkai dan sesat","Al-Fatihah mengandung pokok-pokok ajaran Islam: tauhid, ibadah, dan akhirat"],kesimpulan:"Surat Al-Fatihah adalah surat pertama dalam Al-Quran yang berisi 7 ayat. Surat ini merupakan rukun dalam shalat yang wajib dibaca pada setiap rakaat. Al-Fatihah mengandung tiga pokok ajaran Islam: Tauhid (keesaan Allah), Ibadah (penyembahan hanya kepada Allah), dan Hari Pembalasan (kepercayaan pada akhirat). Surat ini mengajarkan kita untuk selalu memuji Allah, memohon pertolongan-Nya, dan meminta petunjuk ke jalan yang lurus."},Tf={id:"an-nas",nama:"An-Nas",namaArab:"الناس",arti:"Manusia",jumlahAyat:6,tempatTurun:"Madinah (Madaniyah)",urutan:114,ayat:[{nomor:1,arab:"قُلْ أَعُوذُ بِرَبِّ النَّاسِ",latin:"Qul a'ūżu birabbinnās",terjemahan:'Katakanlah, "Aku berlindung kepada Tuhannya manusia.'},{nomor:2,arab:"مَلِكِ النَّاسِ",latin:"Malikin-nās",terjemahan:"Raja manusia."},{nomor:3,arab:"إِلَٰهِ النَّاسِ",latin:"Ilāhin-nās",terjemahan:"Sembahan manusia."},{nomor:4,arab:"مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ",latin:"Min syarril-waswāsil-khannās",terjemahan:"Dari kejahatan (bisikan) setan yang bersembunyi."},{nomor:5,arab:"الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ",latin:"Allażī yuwaswisu fī ṣudūrin-nās",terjemahan:"Yang membisikkan (kejahatan) ke dalam dada manusia."},{nomor:6,arab:"مِنَ الْجِنَّةِ وَالنَّاسِ",latin:"Minal-jinnati wannās",terjemahan:"Dari (golongan) jin dan manusia."}],kosaKata:[{arab:"قُلْ",latin:"Qul",arti:"Katakanlah"},{arab:"أَعُوذُ",latin:"A'udzu",arti:"Aku berlindung"},{arab:"بِرَبِّ",latin:"Bi Rabbi",arti:"Kepada Tuhan"},{arab:"النَّاسِ",latin:"An-Nas",arti:"Manusia"},{arab:"مَلِكِ",latin:"Maliki",arti:"Raja"},{arab:"إِلَٰهِ",latin:"Ilahi",arti:"Sembahan/Tuhan"},{arab:"شَرِّ",latin:"Syarri",arti:"Kejahatan"},{arab:"الْوَسْوَاسِ",latin:"Al-Waswas",arti:"Bisikan (setan)"},{arab:"الْخَنَّاسِ",latin:"Al-Khannas",arti:"Yang bersembunyi"},{arab:"يُوَسْوِسُ",latin:"Yuwaswisu",arti:"Membisikkan"},{arab:"صُدُورِ",latin:"Shudur",arti:"Dada-dada"},{arab:"الْجِنَّةِ",latin:"Al-Jinnah",arti:"Jin"}],asbabunNuzul:`Surat An-Nas dan Al-Falaq (disebut Al-Mu'awwidzatain) turun berkaitan dengan peristiwa sihir yang menimpa Rasulullah SAW. Diriwayatkan bahwa seorang Yahudi bernama Labid bin Al-A'sham menyihir Nabi Muhammad SAW dengan menggunakan sisir, rambut yang terlepas, dan kulit mayang kurma.

Akibat sihir tersebut, Rasulullah SAW menjadi sakit dan merasa seolah-olah melakukan sesuatu padahal tidak melakukannya. Kemudian Allah SWT mengutus Malaikat Jibril untuk memberitahu lokasi sihir tersebut (di sumur Dzarwan) dan turunlah kedua surat ini sebagai obat dan perlindungan.

Setelah membaca kedua surat ini, ikatan sihir terlepas satu per satu dan Rasulullah SAW sembuh. Sejak itu, kedua surat ini menjadi bacaan utama untuk berlindung dari segala kejahatan.`,pelajaran:["Hanya Allah yang patut dijadikan tempat berlindung dari segala kejahatan","Allah memiliki tiga sifat agung: Rabb (Tuhan/Pemelihara), Malik (Raja), dan Ilah (Sembahan)","Setan selalu berusaha membisikkan kejahatan ke dalam hati manusia","Setan bersifat khannas (bersembunyi) dan muncul saat manusia lalai dari mengingat Allah","Bisikan jahat bisa datang dari setan jin maupun setan manusia","Pentingnya selalu berlindung kepada Allah dari godaan setan","Membaca surat ini merupakan bentuk ikhtiar spiritual untuk menjaga diri","Keimanan yang kuat adalah benteng terbaik dari gangguan setan"],kesimpulan:"Surat An-Nas adalah surat terakhir (ke-114) dalam Al-Quran yang terdiri dari 6 ayat. Surat ini mengajarkan kita untuk berlindung kepada Allah dari kejahatan bisikan setan yang bersembunyi. Allah disebut dengan tiga sifat-Nya: Tuhan manusia, Raja manusia, dan Sembahan manusia. Surat ini mengingatkan bahwa godaan kejahatan bisa datang dari jin maupun manusia, sehingga kita harus selalu waspada dan berlindung kepada Allah."},Hf={id:"al-falaq",nama:"Al-Falaq",namaArab:"الفلق",arti:"Waktu Subuh",jumlahAyat:5,tempatTurun:"Madinah (Madaniyah)",urutan:113,ayat:[{nomor:1,arab:"قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ",latin:"Qul a'ūżu birabbil-falaq",terjemahan:'Katakanlah, "Aku berlindung kepada Tuhan yang menguasai subuh (fajar).'},{nomor:2,arab:"مِن شَرِّ مَا خَلَقَ",latin:"Min syarri mā khalaq",terjemahan:"Dari kejahatan (makhluk yang) Dia ciptakan."},{nomor:3,arab:"وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ",latin:"Wa min syarri ghāsiqin iżā waqab",terjemahan:"Dan dari kejahatan malam apabila telah gelap gulita."},{nomor:4,arab:"وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ",latin:"Wa min syarrin-naffāṡāti fil-'uqad",terjemahan:"Dan dari kejahatan (perempuan-perempuan) penyihir yang meniup pada buhul-buhul (talinya)."},{nomor:5,arab:"وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ",latin:"Wa min syarri ḥāsidin iżā ḥasad",terjemahan:"Dan dari kejahatan orang yang dengki apabila dia dengki."}],kosaKata:[{arab:"قُلْ",latin:"Qul",arti:"Katakanlah"},{arab:"أَعُوذُ",latin:"A'udzu",arti:"Aku berlindung"},{arab:"بِرَبِّ",latin:"Bi Rabbi",arti:"Kepada Tuhan"},{arab:"الْفَلَقِ",latin:"Al-Falaq",arti:"Waktu subuh/fajar"},{arab:"شَرِّ",latin:"Syarri",arti:"Kejahatan"},{arab:"مَا خَلَقَ",latin:"Ma Khalaq",arti:"Apa yang diciptakan"},{arab:"غَاسِقٍ",latin:"Ghasiq",arti:"Malam gelap"},{arab:"وَقَبَ",latin:"Waqab",arti:"Gelap gulita"},{arab:"النَّفَّاثَاتِ",latin:"An-Naffatsat",arti:"Peniup-peniup (penyihir)"},{arab:"الْعُقَدِ",latin:"Al-'Uqad",arti:"Buhul-buhul (ikatan)"},{arab:"حَاسِدٍ",latin:"Hasid",arti:"Orang yang dengki"},{arab:"حَسَدَ",latin:"Hasad",arti:"Dengki"}],asbabunNuzul:`Surat Al-Falaq turun bersama dengan surat An-Nas (keduanya disebut Al-Mu'awwidzatain). Asbabun nuzulnya berkaitan dengan peristiwa sihir yang menimpa Rasulullah SAW oleh Labid bin Al-A'sham.

Menurut riwayat, Labid bin Al-A'sham yang merupakan orang Yahudi dari Bani Zuraiq, mengambil sisir dan beberapa helai rambut Rasulullah yang rontok, lalu disihir dan diikat dengan sebelas ikatan dan dimasukkan ke dalam sumur Dzarwan.

Allah kemudian menurunkan Malaikat Jibril membawa kedua surat ini. Setiap kali satu ayat dibaca, satu ikatan terlepas hingga seluruh ikatan terlepas dan Rasulullah sembuh total. Peristiwa ini menunjukkan bahwa sihir itu nyata adanya, dan perlindungan terbaik adalah dengan memohon kepada Allah.`,pelajaran:["Allah adalah Rabb Al-Falaq, Tuhan yang menciptakan waktu subuh sebagai simbol harapan dan cahaya","Kita harus berlindung dari kejahatan semua makhluk ciptaan Allah","Kegelapan malam adalah waktu yang rawan dari kejahatan, sehingga perlu perlindungan ekstra","Sihir adalah nyata dan kita harus berlindung darinya dengan kekuatan spiritual","Hasad (dengki) adalah penyakit hati yang sangat berbahaya","Kita harus menghindari sifat dengki dan memohon perlindungan dari orang yang dengki","Membaca surat ini secara rutin sebagai bentuk perlindungan diri","Keyakinan kepada Allah adalah senjata utama menghadapi kejahatan"],kesimpulan:"Surat Al-Falaq adalah surat ke-113 dalam Al-Quran yang terdiri dari 5 ayat. Surat ini mengajarkan kita untuk berlindung kepada Allah dari empat jenis kejahatan: kejahatan semua makhluk, kejahatan kegelapan malam, kejahatan sihir, dan kejahatan orang yang dengki. Surat ini bersama An-Nas disebut Al-Mu'awwidzatain dan dianjurkan untuk dibaca sebagai perlindungan, terutama sebelum tidur dan setelah shalat."},zf={id:"al-ikhlas",nama:"Al-Ikhlas",namaArab:"الإخلاص",arti:"Keikhlasan/Kemurnian",jumlahAyat:4,tempatTurun:"Makkah (Makkiyah)",urutan:112,ayat:[{nomor:1,arab:"قُلْ هُوَ اللَّهُ أَحَدٌ",latin:"Qul huwallāhu aḥad",terjemahan:'Katakanlah (Muhammad), "Dialah Allah, Yang Maha Esa.'},{nomor:2,arab:"اللَّهُ الصَّمَدُ",latin:"Allāhuṣ-ṣamad",terjemahan:"Allah tempat meminta segala sesuatu."},{nomor:3,arab:"لَمْ يَلِدْ وَلَمْ يُولَدْ",latin:"Lam yalid wa lam yūlad",terjemahan:"(Allah) tidak beranak dan tidak pula diperanakkan."},{nomor:4,arab:"وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ",latin:"Wa lam yakul lahū kufuwan aḥad",terjemahan:"Dan tidak ada sesuatu yang setara dengan Dia."}],kosaKata:[{arab:"قُلْ",latin:"Qul",arti:"Katakanlah"},{arab:"هُوَ",latin:"Huwa",arti:"Dia"},{arab:"اللَّهُ",latin:"Allah",arti:"Allah"},{arab:"أَحَدٌ",latin:"Ahad",arti:"Yang Maha Esa"},{arab:"الصَّمَدُ",latin:"Ash-Shamad",arti:"Tempat bergantung"},{arab:"لَمْ يَلِدْ",latin:"Lam Yalid",arti:"Tidak beranak"},{arab:"لَمْ يُولَدْ",latin:"Lam Yulad",arti:"Tidak diperanakkan"},{arab:"كُفُوًا",latin:"Kufuwan",arti:"Yang setara/sebanding"}],asbabunNuzul:`Surat Al-Ikhlas turun sebagai jawaban atas pertanyaan kaum musyrikin Quraisy tentang sifat-sifat Allah. Mereka bertanya kepada Rasulullah SAW, "Sebutkanlah kepada kami nasab (keturunan) Tuhanmu!" atau dalam riwayat lain, "Jelaskan kepada kami sifat Tuhanmu yang kamu sembah!"

Dalam riwayat lain disebutkan bahwa kaum Yahudi juga bertanya, "Tuhan yang kamu sembah itu terbuat dari apa? Apakah dari emas, perak, atau tembaga?"

Maka turunlah surat Al-Ikhlas yang menjelaskan hakikat Allah SWT dengan sangat jelas dan tegas. Surat ini menjadi jawaban sempurna tentang konsep Tauhid dalam Islam, membantah segala bentuk kemusyrikan, trinitas, dan penyekutuan Allah.

Rasulullah SAW bersabda bahwa membaca surat Al-Ikhlas sebanding dengan membaca sepertiga Al-Quran, karena surat ini mengandung inti ajaran tauhid yang merupakan pondasi utama Islam.`,pelajaran:["Allah adalah Tuhan Yang Maha Esa, tidak ada sekutu bagi-Nya (konsep Tauhid)","Allah adalah Ash-Shamad, tempat bergantung semua makhluk","Allah tidak beranak dan tidak diperanakkan, berbeda dengan makhluk","Tidak ada sesuatu pun yang setara atau sebanding dengan Allah","Keikhlasan dalam beribadah hanya kepada Allah semata","Surat ini adalah bantahan terhadap semua bentuk kemusyrikan","Membaca surat ini 3 kali sebanding dengan membaca seluruh Al-Quran","Tauhid adalah pondasi utama keimanan seorang Muslim","Allah Maha Sempurna dan tidak memiliki kekurangan apapun"],kesimpulan:"Surat Al-Ikhlas adalah surat ke-112 dalam Al-Quran yang terdiri dari 4 ayat. Meskipun singkat, surat ini mengandung inti ajaran Tauhid yang sangat fundamental. Surat ini menegaskan bahwa Allah itu Esa, tempat bergantung semua makhluk, tidak beranak dan tidak diperanakkan, serta tidak ada yang setara dengan-Nya. Rasulullah SAW menyatakan bahwa membaca surat ini sebanding dengan membaca sepertiga Al-Quran karena kandungan tauhidnya yang sangat mendalam."},wf={id:"al-lahab",nama:"Al-Lahab",namaArab:"اللهب",arti:"Gejolak Api",jumlahAyat:5,tempatTurun:"Makkah (Makkiyah)",urutan:111,ayat:[{nomor:1,arab:"تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ",latin:"Tabbat yadā abī lahabiw wa tabb",terjemahan:"Binasalah kedua tangan Abu Lahab dan benar-benar binasa dia!"},{nomor:2,arab:"مَا أَغْنَىٰ عَنْهُ مَالُهُ وَمَا كَسَبَ",latin:"Mā aghnā 'anhu māluhū wa mā kasab",terjemahan:"Tidaklah berguna baginya hartanya dan apa yang dia usahakan."},{nomor:3,arab:"سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ",latin:"Sayaṣlā nāran żāta lahab",terjemahan:"Kelak dia akan masuk ke dalam api yang bergejolak (neraka)."},{nomor:4,arab:"وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ",latin:"Wamra'atuhū ḥammālatal-ḥaṭab",terjemahan:"Dan (begitu pula) istrinya, pembawa kayu bakar (penyebar fitnah)."},{nomor:5,arab:"فِي جِيدِهَا حَبْلٌ مِّن مَّسَدٍ",latin:"Fī jīdihā ḥablum mim masad",terjemahan:"Di lehernya ada tali dari sabut (yang dipintal)."}],kosaKata:[{arab:"تَبَّتْ",latin:"Tabbat",arti:"Binasalah"},{arab:"يَدَا",latin:"Yada",arti:"Kedua tangan"},{arab:"أَبِي لَهَبٍ",latin:"Abi Lahab",arti:"Abu Lahab (Bapak jilatan api)"},{arab:"مَا أَغْنَىٰ",latin:"Ma Aghna",arti:"Tidak berguna"},{arab:"مَالُهُ",latin:"Maluhu",arti:"Hartanya"},{arab:"كَسَبَ",latin:"Kasab",arti:"Usaha/hasil usaha"},{arab:"سَيَصْلَىٰ",latin:"Sayashla",arti:"Akan masuk"},{arab:"نَارًا",latin:"Naran",arti:"Api (neraka)"},{arab:"ذَاتَ لَهَبٍ",latin:"Dzata Lahab",arti:"Yang bergejolak"},{arab:"امْرَأَتُهُ",latin:"Imra'atuhu",arti:"Istrinya"},{arab:"حَمَّالَةَ الْحَطَبِ",latin:"Hammalatal Hathab",arti:"Pembawa kayu bakar"},{arab:"جِيدِهَا",latin:"Jidiha",arti:"Lehernya"},{arab:"حَبْلٌ",latin:"Hablun",arti:"Tali"},{arab:"مَسَدٍ",latin:"Masad",arti:"Sabut (yang dipintal)"}],asbabunNuzul:`Surat Al-Lahab turun berkaitan dengan sikap permusuhan Abu Lahab (paman Nabi Muhammad SAW) dan istrinya, Ummu Jamil, terhadap dakwah Islam.

Ketika Rasulullah SAW menerima perintah untuk berdakwah secara terang-terangan melalui ayat "Dan berilah peringatan kepada kerabat-kerabatmu yang terdekat" (QS. Asy-Syu'ara: 214), beliau naik ke bukit Shafa dan memanggil seluruh klan Quraisy.

Setelah semua berkumpul, Rasulullah berkata, "Jika aku beritahu kalian bahwa di balik bukit ini ada pasukan berkuda yang siap menyerang kalian, apakah kalian mempercayaiku?" Mereka menjawab, "Ya, kami tidak pernah melihatmu berbohong."

Kemudian Rasulullah bersabda, "Sesungguhnya aku adalah pemberi peringatan bagi kalian dari azab yang pedih."

Abu Lahab lalu berkata dengan marah, "Celakalah engkau! Apakah untuk ini engkau mengumpulkan kami?" Maka turunlah surat ini sebagai balasan atas permusuhan dan penghinaan Abu Lahab.

Abu Lahab dan istrinya terus menerus menentang dakwah Nabi. Ummu Jamil bahkan menebarkan duri-duri di jalan yang biasa dilalui Rasulullah.`,pelajaran:["Permusuhan terhadap kebenaran akan berakhir dengan kebinasaan","Harta dan kedudukan tidak akan berguna jika digunakan untuk menentang Allah","Hubungan kekerabatan tidak menjamin keselamatan jika menolak kebenaran","Istri yang buruk dapat memperburuk suami dalam kemaksiatan","Balasan bagi orang yang memusuhi Islam adalah neraka","Kebenaran Al-Quran terbukti dengan kematian Abu Lahab dalam keadaan kafir","Kita harus mendukung dakwah, bukan menghalanginya","Sombong dan angkuh terhadap kebenaran adalah sifat tercela"],kesimpulan:"Surat Al-Lahab (Al-Masad) adalah surat ke-111 dalam Al-Quran yang terdiri dari 5 ayat. Surat ini turun untuk mengecam Abu Lahab dan istrinya yang sangat memusuhi Rasulullah SAW dan dakwah Islam. Surat ini mengandung pelajaran bahwa harta dan kedudukan tidak akan berguna di hadapan Allah jika digunakan untuk menentang kebenaran. Abu Lahab meninggal beberapa hari setelah kekalahan Quraisy di Perang Badar, membuktikan kebenaran surat ini."},Bf={id:"an-nasr",nama:"An-Nasr",namaArab:"النصر",arti:"Pertolongan",jumlahAyat:3,tempatTurun:"Madinah (Madaniyah)",urutan:110,ayat:[{nomor:1,arab:"إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ",latin:"Iżā jā'a naṣrullāhi wal-fatḥ",terjemahan:"Apabila telah datang pertolongan Allah dan kemenangan."},{nomor:2,arab:"وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا",latin:"Wa ra'aitan-nāsa yadkhulūna fī dīnillāhi afwājā",terjemahan:"Dan engkau melihat manusia berbondong-bondong masuk agama Allah (Islam)."},{nomor:3,arab:"فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ ۚ إِنَّهُ كَانَ تَوَّابًا",latin:"Fasabbiḥ biḥamdi rabbika wastaghfirh, innahū kāna tawwābā",terjemahan:"Maka bertasbihlah dengan memuji Tuhanmu dan mohonlah ampunan kepada-Nya. Sungguh, Dia Maha Penerima tobat."}],kosaKata:[{arab:"إِذَا",latin:"Idza",arti:"Apabila/Ketika"},{arab:"جَاءَ",latin:"Ja'a",arti:"Telah datang"},{arab:"نَصْرُ",latin:"Nashru",arti:"Pertolongan"},{arab:"اللَّهِ",latin:"Allah",arti:"Allah"},{arab:"الْفَتْحُ",latin:"Al-Fath",arti:"Kemenangan"},{arab:"رَأَيْتَ",latin:"Ra'aita",arti:"Engkau melihat"},{arab:"النَّاسَ",latin:"An-Nas",arti:"Manusia"},{arab:"يَدْخُلُونَ",latin:"Yadkhulun",arti:"Mereka masuk"},{arab:"دِينِ",latin:"Din",arti:"Agama"},{arab:"أَفْوَاجًا",latin:"Afwaja",arti:"Berbondong-bondong"},{arab:"فَسَبِّحْ",latin:"Fasabbih",arti:"Maka bertasbihlah"},{arab:"بِحَمْدِ",latin:"Bihamdi",arti:"Dengan memuji"},{arab:"رَبِّكَ",latin:"Rabbika",arti:"Tuhanmu"},{arab:"اسْتَغْفِرْهُ",latin:"Istaghfirhu",arti:"Mohonlah ampunan kepada-Nya"},{arab:"تَوَّابًا",latin:"Tawwaba",arti:"Maha Penerima tobat"}],asbabunNuzul:`Surat An-Nasr adalah surat terakhir yang diturunkan secara lengkap kepada Rasulullah SAW. Surat ini turun di Mina saat Haji Wada' (Haji Perpisahan), sekitar 80 atau 110 hari sebelum wafatnya Rasulullah SAW.

Surat ini turun setelah Fathu Makkah (Pembebasan Makkah) pada tahun 8 Hijriah, ketika Rasulullah SAW menyaksikan kemenangan besar Islam dan banyaknya orang yang masuk Islam berbondong-bondong.

Abdullah bin Abbas menceritakan bahwa ketika surat ini turun, Rasulullah SAW mengetahui bahwa ajalnya sudah dekat. Umar bin Khattab memahami ini ketika Rasulullah bertanya tentang makna surat ini kepada para sahabat.

Surat ini mengisyaratkan bahwa misi dakwah Rasulullah SAW telah sempurna dan inilah saatnya untuk mempersiapkan diri menghadap Allah dengan memperbanyak tasbih dan istighfar.`,pelajaran:["Pertolongan dan kemenangan datang dari Allah SWT semata","Kemenangan Islam ditandai dengan banyaknya orang masuk Islam","Saat berhasil, kita harus semakin merendah dan bersyukur kepada Allah","Memperbanyak tasbih dan istighfar adalah bentuk syukur atas keberhasilan","Tidak boleh sombong saat mendapat kemenangan","Allah Maha Penerima tobat bagi siapa saja yang bertobat","Kehidupan dunia ada batasnya, kita harus mempersiapkan akhirat","Keberhasilan dakwah adalah anugerah dari Allah, bukan kehebatan manusia"],kesimpulan:"Surat An-Nasr adalah surat ke-110 dalam Al-Quran yang terdiri dari 3 ayat dan merupakan surat terakhir yang turun secara lengkap. Surat ini turun setelah Fathu Makkah ketika Islam telah jaya dan banyak orang masuk Islam. Pesan utamanya adalah ketika mendapat pertolongan dan kemenangan dari Allah, kita harus semakin merendahkan diri dengan bertasbih, memuji Allah, dan memohon ampunan. Surat ini juga mengisyaratkan dekatnya wafat Rasulullah SAW."},Df={id:"al-kafirun",nama:"Al-Kafirun",namaArab:"الكافرون",arti:"Orang-orang Kafir",jumlahAyat:6,tempatTurun:"Makkah (Makkiyah)",urutan:109,ayat:[{nomor:1,arab:"قُلْ يَا أَيُّهَا الْكَافِرُونَ",latin:"Qul yā ayyuhal-kāfirūn",terjemahan:'Katakanlah (Muhammad), "Wahai orang-orang kafir!'},{nomor:2,arab:"لَا أَعْبُدُ مَا تَعْبُدُونَ",latin:"Lā a'budu mā ta'budūn",terjemahan:"Aku tidak akan menyembah apa yang kamu sembah."},{nomor:3,arab:"وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ",latin:"Wa lā antum 'ābidūna mā a'bud",terjemahan:"Dan kamu bukan penyembah apa yang aku sembah."},{nomor:4,arab:"وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ",latin:"Wa lā ana 'ābidum mā 'abattum",terjemahan:"Dan aku tidak pernah menjadi penyembah apa yang kamu sembah."},{nomor:5,arab:"وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ",latin:"Wa lā antum 'ābidūna mā a'bud",terjemahan:"Dan kamu tidak pernah (pula) menjadi penyembah apa yang aku sembah."},{nomor:6,arab:"لَكُمْ دِينُكُمْ وَلِيَ دِينِ",latin:"Lakum dīnukum waliya dīn",terjemahan:'Untukmu agamamu, dan untukku agamaku."'}],kosaKata:[{arab:"قُلْ",latin:"Qul",arti:"Katakanlah"},{arab:"يَا أَيُّهَا",latin:"Ya Ayyuha",arti:"Wahai"},{arab:"الْكَافِرُونَ",latin:"Al-Kafirun",arti:"Orang-orang kafir"},{arab:"لَا",latin:"La",arti:"Tidak"},{arab:"أَعْبُدُ",latin:"A'budu",arti:"Aku menyembah"},{arab:"مَا",latin:"Ma",arti:"Apa"},{arab:"تَعْبُدُونَ",latin:"Ta'budun",arti:"Kamu sembah"},{arab:"أَنتُمْ",latin:"Antum",arti:"Kamu (jamak)"},{arab:"عَابِدُونَ",latin:"'Abidun",arti:"Penyembah"},{arab:"دِينُكُمْ",latin:"Dinukum",arti:"Agamamu"},{arab:"دِينِ",latin:"Din",arti:"Agamaku"}],asbabunNuzul:`Surat Al-Kafirun turun berkaitan dengan upaya para pemimpin Quraisy untuk berkompromi dengan Rasulullah SAW dalam masalah ibadah.

Diriwayatkan bahwa pemimpin-pemimpin Quraisy seperti Al-Walid bin Al-Mughirah, Al-'Ash bin Wa'il, Al-Aswad bin Abdul Muthalib, dan Umayyah bin Khalaf datang kepada Rasulullah SAW dan mengajukan proposal:

"Wahai Muhammad, bagaimana kalau kita berkompromi? Kamu menyembah Tuhan kami selama satu tahun, dan kami akan menyembah Tuhanmu selama satu tahun berikutnya. Atau kamu menyembah Tuhan kami di siang hari, dan kami menyembah Tuhanmu di malam hari."

Rasulullah SAW menolak keras proposal ini karena bertentangan dengan prinsip Tauhid. Maka turunlah surat Al-Kafirun sebagai penegasan bahwa tidak ada kompromi dalam masalah akidah dan ibadah.

Surat ini menjadi pernyataan tegas tentang pemisahan total antara keimanan dan kekufuran, serta prinsip toleransi dalam beragama: "Bagimu agamamu, dan bagiku agamaku."`,pelajaran:["Tidak ada kompromi dalam masalah akidah dan tauhid","Keimanan kepada Allah harus murni tanpa dicampuri kemusyrikan","Prinsip toleransi beragama: tidak memaksakan agama kepada orang lain","Ketegasan dalam mempertahankan keyakinan adalah sikap terpuji","Islam mengajarkan kebebasan beragama dengan tanggung jawab masing-masing","Rasulullah SAW adalah teladan dalam keteguhan iman","Tidak boleh mencampur adukkan kebenaran dengan kebatilan","Setiap orang bertanggung jawab atas pilihannya sendiri"],kesimpulan:'Surat Al-Kafirun adalah surat ke-109 dalam Al-Quran yang terdiri dari 6 ayat. Surat ini turun sebagai penolakan tegas terhadap proposal kompromi dalam ibadah dari kaum Quraisy. Pesan utamanya adalah kemurnian tauhid tidak bisa dikompromikan, namun tetap menghormati kebebasan beragama dengan prinsip "bagimu agamamu, bagiku agamaku". Surat ini juga disebut "Al-Ikhlas" kedua karena mengandung kemurnian tauhid dan dianjurkan dibaca saat shalat subuh.'},Kf={id:"al-kautsar",nama:"Al-Kautsar",namaArab:"الكوثر",arti:"Nikmat yang Berlimpah",jumlahAyat:3,tempatTurun:"Makkah (Makkiyah)",urutan:108,ayat:[{nomor:1,arab:"إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ",latin:"Innā a'ṭainākal-kauṡar",terjemahan:"Sungguh, Kami telah memberimu (Muhammad) nikmat yang banyak."},{nomor:2,arab:"فَصَلِّ لِرَبِّكَ وَانْحَرْ",latin:"Faṣalli lirabbika wanḥar",terjemahan:"Maka laksanakanlah shalat karena Tuhanmu, dan berkurbanlah (sebagai ibadah dan mendekatkan diri kepada Allah)."},{nomor:3,arab:"إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ",latin:"Inna syāni'aka huwal-abtar",terjemahan:"Sungguh, orang-orang yang membencimu dialah yang terputus (dari rahmat Allah)."}],kosaKata:[{arab:"إِنَّا",latin:"Inna",arti:"Sesungguhnya Kami"},{arab:"أَعْطَيْنَاكَ",latin:"A'thainaka",arti:"Kami telah memberimu"},{arab:"الْكَوْثَرَ",latin:"Al-Kautsar",arti:"Nikmat yang banyak/Telaga di surga"},{arab:"فَصَلِّ",latin:"Fashalli",arti:"Maka shalatlah"},{arab:"لِرَبِّكَ",latin:"Lirabbika",arti:"Untuk Tuhanmu"},{arab:"انْحَرْ",latin:"Wanhar",arti:"Dan berkurbanlah"},{arab:"شَانِئَكَ",latin:"Syani'aka",arti:"Orang yang membencimu"},{arab:"الْأَبْتَرُ",latin:"Al-Abtar",arti:"Yang terputus (keturunan/kebaikan)"}],asbabunNuzul:`Surat Al-Kautsar turun berkaitan dengan hinaan yang dilontarkan oleh Al-'Ash bin Wa'il As-Sahmi (dan dalam riwayat lain Abu Jahl atau 'Uqbah bin Abi Mu'aith) kepada Rasulullah SAW.

Ketika putra Rasulullah SAW yang bernama Abdullah (atau dalam riwayat lain Ibrahim) wafat, Al-'Ash bin Wa'il berkata dengan mengejek, "Muhammad adalah orang yang terputus keturunannya (abtar). Setelah dia mati, tidak ada yang akan mengingatnya lagi."

Kata "abtar" dalam bahasa Arab bermakna orang yang tidak memiliki keturunan laki-laki atau orang yang terputus dari segala kebaikan. Hinaan ini sangat menyakitkan bagi Rasulullah SAW.

Maka Allah SWT menurunkan surat ini untuk menghibur Rasulullah SAW dan memberitahukan bahwa Allah telah menganugerahkan kepada beliau Al-Kautsar (nikmat yang sangat banyak, termasuk telaga di surga). Sebaliknya, orang-orang yang membenci beliaulah yang sebenarnya terputus dari segala kebaikan.

Kenyataannya, nama Muhammad adalah nama yang paling banyak digunakan di dunia, dan ajarannya tersebar ke seluruh penjuru dunia hingga kiamat.`,pelajaran:["Allah memberikan nikmat yang berlimpah kepada Rasulullah SAW dan umatnya","Al-Kautsar adalah telaga di surga yang akan diminumi oleh umat Nabi Muhammad","Rasa syukur atas nikmat diwujudkan dengan shalat dan berkurban","Ibadah harus dilakukan dengan ikhlas semata-mata karena Allah","Orang yang membenci kebenaran akan terputus dari rahmat Allah","Jangan berkecil hati atas hinaan orang lain","Allah senantiasa membela hamba-Nya yang beriman","Berkurban (qurban) adalah ibadah yang sangat mulia","Warisan terbaik adalah ajaran dan kebaikan, bukan harta"],kesimpulan:'Surat Al-Kautsar adalah surat ke-108 dalam Al-Quran dan merupakan surat terpendek dengan 3 ayat. Surat ini turun untuk menghibur Rasulullah SAW dari hinaan orang-orang kafir yang menyebutnya "abtar" (terputus keturunan). Allah menegaskan bahwa Rasulullah diberi Al-Kautsar (nikmat berlimpah dan telaga di surga), sementara orang-orang yang membencinyalah yang sebenarnya terputus dari kebaikan. Surat ini mengajarkan cara bersyukur dengan shalat dan berkurban.'},Ef={id:"al-maun",nama:"Al-Ma'un",namaArab:"الماعون",arti:"Barang-barang yang Berguna",jumlahAyat:7,tempatTurun:"Makkah (Makkiyah)",urutan:107,ayat:[{nomor:1,arab:"أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ",latin:"Ara'aytallażī yukażżibu biddīn",terjemahan:"Tahukah kamu (orang) yang mendustakan agama?"},{nomor:2,arab:"فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ",latin:"Fażālikallażī yadu''ul-yatīm",terjemahan:"Maka itulah orang yang menghardik anak yatim."},{nomor:3,arab:"وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ",latin:"Wa lā yaḥuḍḍu 'alā ṭa'āmil-miskīn",terjemahan:"Dan tidak menganjurkan memberi makan orang miskin."},{nomor:4,arab:"فَوَيْلٌ لِّلْمُصَلِّينَ",latin:"Fa wailul lil-muṣallīn",terjemahan:"Maka celakalah orang yang shalat."},{nomor:5,arab:"الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ",latin:"Allażīna hum 'an ṣalātihim sāhūn",terjemahan:"(Yaitu) orang-orang yang lalai terhadap shalatnya."},{nomor:6,arab:"الَّذِينَ هُمْ يُرَاءُونَ",latin:"Allażīna hum yurā'ūn",terjemahan:"Yang berbuat riya."},{nomor:7,arab:"وَيَمْنَعُونَ الْمَاعُونَ",latin:"Wa yamna'ūnal-mā'ūn",terjemahan:"Dan enggan (memberikan) bantuan."}],kosaKata:[{arab:"أَرَأَيْتَ",latin:"Ara'aita",arti:"Tahukah kamu"},{arab:"يُكَذِّبُ",latin:"Yukaddzibu",arti:"Mendustakan"},{arab:"الدِّينِ",latin:"Ad-Din",arti:"Agama"},{arab:"يَدُعُّ",latin:"Yadu''u",arti:"Menghardik"},{arab:"الْيَتِيمَ",latin:"Al-Yatim",arti:"Anak yatim"},{arab:"يَحُضُّ",latin:"Yahudhdhu",arti:"Menganjurkan"},{arab:"طَعَامِ",latin:"Tha'am",arti:"Makanan"},{arab:"الْمِسْكِينِ",latin:"Al-Miskin",arti:"Orang miskin"},{arab:"وَيْلٌ",latin:"Wail",arti:"Celakalah"},{arab:"الْمُصَلِّينَ",latin:"Al-Mushallin",arti:"Orang-orang yang shalat"},{arab:"سَاهُونَ",latin:"Sahun",arti:"Lalai"},{arab:"يُرَاءُونَ",latin:"Yura'un",arti:"Berbuat riya"},{arab:"الْمَاعُونَ",latin:"Al-Ma'un",arti:"Bantuan/barang berguna"}],asbabunNuzul:`Surat Al-Ma'un turun berkaitan dengan beberapa orang munafik dan orang-orang yang buruk perilakunya.

Menurut sebagian riwayat, ayat 1-3 turun berkaitan dengan Abu Sufyan bin Harb (sebelum masuk Islam) yang menyembelih dua ekor unta setiap minggu. Suatu hari seorang anak yatim datang meminta daging, namun Abu Sufyan justru memukulnya dengan tongkat.

Riwayat lain menyebutkan bahwa surat ini turun berkaitan dengan Al-'Ash bin Wa'il As-Sahmi atau Abu Jahl yang sangat kikir dan suka menghardik anak yatim.

Adapun ayat 4-7 turun berkaitan dengan orang-orang munafik yang shalat hanya untuk dipuji manusia (riya'), lalai dari waktu shalat, dan enggan membantu orang lain bahkan untuk meminjamkan barang-barang sederhana seperti ember, kapak, atau panci.

Surat ini menjadi kritik keras terhadap orang yang rajin beribadah secara ritual tetapi mengabaikan aspek sosial dalam agama.`,pelajaran:["Mendustakan agama bisa ditunjukkan dengan perbuatan, bukan hanya ucapan","Menghardik anak yatim adalah tanda mendustakan agama","Tidak peduli dengan orang miskin adalah tanda mendustakan agama","Ibadah ritual harus disertai kepedulian sosial","Shalat yang lalai dan riya tidak diterima Allah","Riya (pamer dalam beribadah) adalah sifat tercela","Enggan membantu orang lain adalah tanda keburukan akhlak","Islam mengajarkan keseimbangan antara ibadah vertikal dan horizontal","Bantuan sekecil apapun (ma'un) harus diberikan kepada yang membutuhkan"],kesimpulan:"Surat Al-Ma'un adalah surat ke-107 dalam Al-Quran yang terdiri dari 7 ayat. Surat ini mendefinisikan ciri-ciri orang yang mendustakan agama: menghardik anak yatim, tidak menganjurkan memberi makan orang miskin, lalai dalam shalat, berbuat riya, dan enggan memberikan bantuan. Pesan utamanya adalah Islam bukan hanya ritual ibadah, tetapi harus diimbangi dengan kepedulian sosial. Shalat yang tidak melahirkan kepedulian sosial adalah shalat yang lalai."},Uf={id:"al-quraisy",nama:"Al-Quraisy",namaArab:"قريش",arti:"Suku Quraisy",jumlahAyat:4,tempatTurun:"Makkah (Makkiyah)",urutan:106,ayat:[{nomor:1,arab:"لِإِيلَافِ قُرَيْشٍ",latin:"Li'īlāfi quraisy",terjemahan:"Karena kebiasaan orang-orang Quraisy."},{nomor:2,arab:"إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ",latin:"Īlāfihim riḥlatasy-syitā'i waṣ-ṣaif",terjemahan:"(Yaitu) kebiasaan mereka bepergian pada musim dingin dan musim panas."},{nomor:3,arab:"فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ",latin:"Falya'budū rabba hāżal-bait",terjemahan:"Maka hendaklah mereka menyembah Tuhan (pemilik) rumah ini (Ka'bah)."},{nomor:4,arab:"الَّذِي أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ",latin:"Allażī aṭ'amahum min jū'iw wa āmanahum min khauf",terjemahan:"Yang telah memberi makanan kepada mereka untuk menghilangkan lapar dan mengamankan mereka dari rasa takut."}],kosaKata:[{arab:"لِإِيلَافِ",latin:"Li Ilafi",arti:"Karena kebiasaan"},{arab:"قُرَيْشٍ",latin:"Quraisy",arti:"Suku Quraisy"},{arab:"رِحْلَةَ",latin:"Rihlata",arti:"Perjalanan"},{arab:"الشِّتَاءِ",latin:"Asy-Syita'i",arti:"Musim dingin"},{arab:"الصَّيْفِ",latin:"Ash-Shaif",arti:"Musim panas"},{arab:"فَلْيَعْبُدُوا",latin:"Falya'budu",arti:"Maka hendaklah mereka menyembah"},{arab:"رَبَّ",latin:"Rabba",arti:"Tuhan"},{arab:"الْبَيْتِ",latin:"Al-Bait",arti:"Rumah (Ka'bah)"},{arab:"أَطْعَمَهُم",latin:"Ath'amahum",arti:"Memberi makan mereka"},{arab:"جُوعٍ",latin:"Ju'in",arti:"Lapar"},{arab:"آمَنَهُم",latin:"Amanahum",arti:"Mengamankan mereka"},{arab:"خَوْفٍ",latin:"Khauf",arti:"Takut"}],asbabunNuzul:`Surat Al-Quraisy turun sebagai kelanjutan dari surat Al-Fil dan berkaitan dengan nikmat-nikmat besar yang Allah berikan kepada suku Quraisy.

Suku Quraisy adalah suku yang sangat dihormati di kalangan bangsa Arab karena mereka adalah penjaga Ka'bah. Kehormatan ini membuat mereka aman melakukan perjalanan dagang ke negeri-negeri lain.

Mereka memiliki dua perjalanan dagang besar:
1. Rihlah Syita' (Perjalanan Musim Dingin): Pergi ke Yaman yang beriklim lebih hangat untuk berdagang rempah-rempah, parfum, dan barang-barang dari India.
2. Rihlah Shaif (Perjalanan Musim Panas): Pergi ke Syam (Suriah) yang beriklim lebih sejuk untuk berdagang hasil bumi dan barang-barang dari utara.

Perjalanan ini membuat Quraisy menjadi kaya dan makmur. Allah mengingatkan mereka atas nikmat ini dan memerintahkan mereka untuk menyembah Allah, Tuhan pemilik Ka'bah, yang telah memberi mereka makan saat lapar dan mengamankan mereka dari rasa takut.

Surat ini juga berkaitan dengan peristiwa pasukan gajah yang dihancurkan Allah (surat Al-Fil), yang menunjukkan perlindungan Allah terhadap Ka'bah dan penduduk Makkah.`,pelajaran:["Nikmat Allah harus disyukuri dengan beribadah kepada-Nya","Allah yang memberikan rezeki dan keamanan kepada manusia","Kehormatan Quraisy berasal dari Ka'bah, bukan dari diri mereka sendiri","Perdagangan adalah mata pencaharian yang mulia","Keamanan dan kecukupan pangan adalah nikmat besar dari Allah","Menyembah Allah adalah bentuk syukur tertinggi","Ka'bah adalah rumah Allah yang harus dihormati","Allah melindungi orang-orang yang beriman kepada-Nya","Kekayaan harus membuat kita semakin dekat kepada Allah"],kesimpulan:"Surat Al-Quraisy adalah surat ke-106 dalam Al-Quran yang terdiri dari 4 ayat. Surat ini mengingatkan suku Quraisy tentang nikmat besar yang Allah berikan: keamanan dalam perjalanan dagang ke Yaman (musim dingin) dan Syam (musim panas), serta kecukupan pangan dan rasa aman. Sebagai bentuk syukur, mereka diperintahkan untuk menyembah Allah, Tuhan pemilik Ka'bah. Surat ini mengajarkan bahwa setiap nikmat harus disyukuri dengan ketaatan kepada Allah."};function Rf(){const[d,j]=vn.useState("an-nas"),v=d==="an-nas"?Tf:Hf;return u.jsxs("div",{className:"space-y-6",children:[u.jsxs("div",{className:"bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl p-6 text-white",children:[u.jsx("h1",{className:"text-2xl md:text-3xl font-bold mb-2",children:"🛡️ Surat An-Nas & Al-Falaq"}),u.jsx("p",{className:"opacity-90",children:"Al-Mu'awwidzatain - Dua surat perlindungan dari segala kejahatan"})]}),u.jsxs("div",{className:"bg-white rounded-2xl shadow-sm border border-gray-100 p-6",children:[u.jsx("h2",{className:"text-xl font-bold text-gray-800 mb-4",children:"📚 Tentang Al-Mu'awwidzatain"}),u.jsxs("div",{className:"prose prose-gray max-w-none text-gray-600",children:[u.jsxs("p",{className:"mb-4",children:[u.jsx("strong",{children:"Al-Mu'awwidzatain"})," (المعوذتين) adalah sebutan untuk dua surat terakhir dalam Al-Quran, yaitu ",u.jsx("strong",{children:"Surat Al-Falaq"})," dan ",u.jsx("strong",{children:"Surat An-Nas"}),`. Kata "Mu'awwidzatain" berasal dari kata "isti'adzah" yang berarti memohon perlindungan.`]}),u.jsx("p",{className:"mb-4",children:"Kedua surat ini turun bersamaan sebagai obat dan perlindungan bagi Rasulullah SAW ketika beliau terkena sihir dari Labid bin Al-A'sham. Rasulullah SAW sangat menganjurkan untuk membaca kedua surat ini sebagai dzikir pagi dan petang, sebelum tidur, dan setelah shalat fardhu."}),u.jsxs("div",{className:"bg-indigo-50 rounded-xl p-4 border border-indigo-200",children:[u.jsx("h3",{className:"font-bold text-indigo-800 mb-2",children:"🌟 Keutamaan Al-Mu'awwidzatain"}),u.jsxs("ul",{className:"text-indigo-700 text-sm space-y-1 mb-0",children:[u.jsx("li",{children:"• Perlindungan dari segala kejahatan makhluk"}),u.jsx("li",{children:"• Perlindungan dari sihir dan gangguan jin"}),u.jsx("li",{children:"• Perlindungan dari hasad (kedengkian)"}),u.jsx("li",{children:"• Perlindungan dari bisikan setan"}),u.jsx("li",{children:"• Dianjurkan dibaca 3x setiap pagi dan petang"})]})]})]})]}),u.jsxs("div",{className:"flex gap-4",children:[u.jsxs("button",{onClick:()=>j("an-nas"),className:`flex-1 p-4 rounded-xl transition-all ${d==="an-nas"?"bg-indigo-600 text-white shadow-lg":"bg-white text-gray-700 border border-gray-200 hover:bg-indigo-50"}`,children:[u.jsx("div",{className:"text-2xl font-arabic mb-1",children:"الناس"}),u.jsx("div",{className:"font-bold",children:"Surat An-Nas"}),u.jsx("div",{className:"text-sm opacity-75",children:"6 Ayat • Surat ke-114"})]}),u.jsxs("button",{onClick:()=>j("al-falaq"),className:`flex-1 p-4 rounded-xl transition-all ${d==="al-falaq"?"bg-purple-600 text-white shadow-lg":"bg-white text-gray-700 border border-gray-200 hover:bg-purple-50"}`,children:[u.jsx("div",{className:"text-2xl font-arabic mb-1",children:"الفلق"}),u.jsx("div",{className:"font-bold",children:"Surat Al-Falaq"}),u.jsx("div",{className:"text-sm opacity-75",children:"5 Ayat • Surat ke-113"})]})]}),u.jsx(Da,{surat:v,color:d==="an-nas"?"indigo":"purple"}),u.jsxs("div",{className:"bg-white rounded-2xl shadow-sm border border-gray-100 p-6",children:[u.jsx("h2",{className:"text-xl font-bold text-gray-800 mb-4",children:"📋 Kesimpulan Al-Mu'awwidzatain"}),u.jsxs("div",{className:"bg-gradient-to-br from-indigo-50 to-purple-50 rounded-xl p-6 border border-indigo-200",children:[u.jsx("p",{className:"text-gray-700 leading-relaxed mb-4",children:"Surat An-Nas dan Al-Falaq adalah dua surat perlindungan yang sangat penting bagi setiap Muslim. Keduanya mengajarkan kita untuk senantiasa berlindung kepada Allah dari segala bentuk kejahatan, baik yang tampak maupun yang tersembunyi."}),u.jsxs("p",{className:"text-gray-700 leading-relaxed mb-4",children:[u.jsx("strong",{children:"Surat Al-Falaq"})," melindungi dari kejahatan eksternal: makhluk ciptaan Allah, kegelapan malam, sihir, dan kedengkian orang lain."]}),u.jsxs("p",{className:"text-gray-700 leading-relaxed",children:[u.jsx("strong",{children:"Surat An-Nas"})," melindungi dari kejahatan internal: bisikan setan yang bersembunyi dalam hati manusia, baik dari golongan jin maupun manusia."]})]}),u.jsxs("div",{className:"mt-4 bg-amber-50 rounded-xl p-4 border border-amber-200",children:[u.jsx("h3",{className:"font-bold text-amber-800 mb-2",children:"⏰ Waktu Membaca Al-Mu'awwidzatain"}),u.jsxs("div",{className:"grid grid-cols-1 md:grid-cols-2 gap-4 text-amber-700 text-sm",children:[u.jsxs("div",{children:[u.jsx("h4",{className:"font-semibold mb-1",children:"Waktu yang Dianjurkan:"}),u.jsxs("ul",{className:"space-y-1",children:[u.jsx("li",{children:"• Setelah shalat 5 waktu"}),u.jsx("li",{children:"• Sebelum tidur (3x masing-masing)"}),u.jsx("li",{children:"• Pagi hari (3x masing-masing)"}),u.jsx("li",{children:"• Petang hari (3x masing-masing)"})]})]}),u.jsxs("div",{children:[u.jsx("h4",{className:"font-semibold mb-1",children:"Cara Membaca:"}),u.jsxs("ul",{className:"space-y-1",children:[u.jsx("li",{children:"• Baca dengan tartil dan khusyuk"}),u.jsx("li",{children:"• Pahami maknanya"}),u.jsx("li",{children:"• Yakin akan perlindungan Allah"}),u.jsx("li",{children:"• Ajarkan kepada keluarga"})]})]})]})]})]})]})}const Mc=[{id:"kebersihan-1",judul:"Kebersihan Sebagian dari Iman",arab:"الطُّهُورُ شَطْرُ الْإِيمَانِ",latin:"Aṭ-ṭuhūru syaṭrul-īmān",arti:"Kebersihan adalah sebagian dari iman.",perawi:"HR. Muslim no. 223, dari Abu Malik Al-Asy'ari radhiyallahu 'anhu",kualitas:"Shahih",kosaKata:[{arab:"الطُّهُورُ",latin:"Ath-Thuhur",arti:"Kebersihan/Bersuci"},{arab:"شَطْرُ",latin:"Syathru",arti:"Sebagian/Setengah"},{arab:"الْإِيمَانِ",latin:"Al-Iman",arti:"Iman/Keimanan"}],penjelasan:`Hadist ini diriwayatkan oleh Imam Muslim dalam kitab Shahih-nya dari sahabat Abu Malik Al-Asy'ari radhiyallahu 'anhu. Hadist ini merupakan bagian dari hadist yang lebih panjang yang berbunyi:

"Kebersihan adalah sebagian dari iman, Alhamdulillah memenuhi timbangan, Subhanallah dan Alhamdulillah memenuhi antara langit dan bumi, shalat adalah cahaya, sedekah adalah bukti, sabar adalah sinar, dan Al-Quran adalah hujjah bagimu atau atasmu."

Kata "syathr" dalam bahasa Arab bisa bermakna "sebagian" atau "setengah". Para ulama menafsirkan bahwa kebersihan memiliki kedudukan yang sangat penting dalam Islam, hingga disebut sebagai bagian dari iman.

Kebersihan yang dimaksud mencakup:
1. Thaharah (bersuci) dari hadats besar dan kecil
2. Kebersihan badan, pakaian, dan tempat
3. Kebersihan hati dari sifat-sifat tercela
4. Kebersihan jiwa dari syirik dan kemunafikan`,pelajaran:["Kebersihan memiliki kedudukan sangat tinggi dalam Islam","Tidak sempurna iman seseorang jika mengabaikan kebersihan","Islam adalah agama yang sangat memperhatikan kebersihan","Kebersihan mencakup lahir (fisik) dan batin (hati)","Bersuci adalah syarat sah nya shalat","Menjaga kebersihan adalah ibadah","Orang beriman harus bersih dalam segala aspek kehidupan","Kebersihan cerminan dari keimanan seseorang"],contohPengamalan:["Berwudhu sebelum shalat dengan sempurna","Mandi wajib setelah hadats besar","Menjaga kebersihan badan dengan mandi teratur","Membersihkan pakaian dari najis","Menjaga kebersihan rumah dan lingkungan","Membuang sampah pada tempatnya","Mencuci tangan sebelum dan sesudah makan","Membersihkan masjid dan tempat ibadah","Menyikat gigi dengan siwak atau sikat gigi","Memotong kuku secara teratur","Membersihkan hati dari dengki dan hasad"],kesimpulan:"Hadist ini menegaskan bahwa kebersihan adalah bagian integral dari keimanan. Seorang Muslim yang baik harus menjaga kebersihan baik secara fisik (badan, pakaian, tempat) maupun spiritual (hati dan jiwa). Mengabaikan kebersihan berarti mengabaikan sebagian dari iman."},{id:"kebersihan-2",judul:"Kebersihan Itu Baik dan Allah Mencintai Kebersihan",arab:"إِنَّ اللَّهَ طَيِّبٌ يُحِبُّ الطَّيِّبَ، نَظِيفٌ يُحِبُّ النَّظَافَةَ",latin:"Innallāha ṭayyibun yuḥibbul-ṭayyib, naẓīfun yuḥibbun-naẓāfah",arti:"Sesungguhnya Allah itu baik dan mencintai kebaikan, bersih dan mencintai kebersihan.",perawi:"HR. Tirmidzi no. 2799, dari Sa'd bin Abi Waqqash radhiyallahu 'anhu",kualitas:"Hasan",kosaKata:[{arab:"إِنَّ",latin:"Inna",arti:"Sesungguhnya"},{arab:"اللَّهَ",latin:"Allah",arti:"Allah"},{arab:"طَيِّبٌ",latin:"Thayyib",arti:"Baik"},{arab:"يُحِبُّ",latin:"Yuhibbu",arti:"Mencintai"},{arab:"الطَّيِّبَ",latin:"Ath-Thayyib",arti:"Kebaikan"},{arab:"نَظِيفٌ",latin:"Nazhif",arti:"Bersih"},{arab:"النَّظَافَةَ",latin:"An-Nazhafah",arti:"Kebersihan"}],penjelasan:`Hadist ini diriwayatkan oleh Imam At-Tirmidzi dari sahabat Sa'd bin Abi Waqqash radhiyallahu 'anhu. Hadist lengkapnya berbunyi:

"Sesungguhnya Allah itu baik dan mencintai kebaikan, bersih dan mencintai kebersihan, mulia dan mencintai kemuliaan, dermawan dan mencintai kedermawanan. Maka bersihkanlah halaman rumah kalian dan janganlah kalian menyerupai orang-orang Yahudi."

Hadist ini menjelaskan beberapa sifat Allah dan apa yang dicintai-Nya:
1. Allah Maha Baik (Thayyib) dan mencintai kebaikan
2. Allah Maha Suci (Nazhif) dan mencintai kebersihan
3. Allah Maha Mulia (Karim) dan mencintai kemuliaan
4. Allah Maha Dermawan (Jawwad) dan mencintai kedermawanan

Rasulullah SAW memerintahkan untuk membersihkan halaman rumah, yang menunjukkan pentingnya menjaga kebersihan lingkungan, bukan hanya kebersihan diri.`,pelajaran:["Allah mencintai kebersihan dan orang-orang yang menjaga kebersihan","Menjaga kebersihan adalah cara mendekatkan diri kepada Allah","Kebersihan mencakup diri sendiri dan lingkungan","Halaman rumah harus dijaga kebersihannya","Allah memiliki sifat-sifat yang sempurna","Kita harus meniru sifat-sifat yang dicintai Allah","Kebersihan adalah bagian dari akhlak mulia","Lingkungan yang bersih mencerminkan keimanan penghuninya"],contohPengamalan:["Membersihkan halaman rumah setiap hari","Menata rumah agar rapi dan bersih","Ikut serta dalam kerja bakti membersihkan lingkungan","Tidak membuang sampah sembarangan","Menjaga kebersihan tempat umum","Membersihkan saluran air dari sampah","Menanam tanaman untuk keindahan lingkungan","Mengajarkan kebersihan kepada anak-anak","Menyediakan tempat sampah di rumah dan sekitarnya"],kesimpulan:"Hadist ini mengajarkan bahwa Allah mencintai kebersihan dan orang-orang yang bersih. Dengan menjaga kebersihan, kita berusaha mendekatkan diri kepada Allah dan mengamalkan apa yang dicintai-Nya. Kebersihan tidak hanya terbatas pada diri sendiri, tetapi juga lingkungan sekitar."},{id:"kebersihan-3",judul:"Lima Fitrah Manusia",arab:"خَمْسٌ مِنَ الْفِطْرَةِ: الْخِتَانُ، وَالِاسْتِحْدَادُ، وَقَصُّ الشَّارِبِ، وَتَقْلِيمُ الْأَظْفَارِ، وَنَتْفُ الْإِبِطِ",latin:"Khamsun minal-fiṭrah: al-khitān, wal-istiḥdād, wa qaṣṣusy-syārib, wa taqlīmul-aẓfār, wa natful-ibṭ",arti:"Lima perkara yang termasuk fitrah: khitan, mencukur bulu kemaluan, memendekkan kumis, memotong kuku, dan mencabut bulu ketiak.",perawi:"HR. Bukhari no. 5889 dan Muslim no. 257, dari Abu Hurairah radhiyallahu 'anhu",kualitas:"Muttafaq 'Alaih (Shahih)",kosaKata:[{arab:"خَمْسٌ",latin:"Khamsun",arti:"Lima"},{arab:"الْفِطْرَةِ",latin:"Al-Fithrah",arti:"Fitrah/Naluri/Kesucian"},{arab:"الْخِتَانُ",latin:"Al-Khitan",arti:"Khitan/Sunat"},{arab:"الِاسْتِحْدَادُ",latin:"Al-Istihdad",arti:"Mencukur bulu kemaluan"},{arab:"قَصُّ الشَّارِبِ",latin:"Qashshusy-Syarib",arti:"Memendekkan kumis"},{arab:"تَقْلِيمُ الْأَظْفَارِ",latin:"Taqlimul-Azfar",arti:"Memotong kuku"},{arab:"نَتْفُ الْإِبِطِ",latin:"Natful-Ibth",arti:"Mencabut bulu ketiak"}],penjelasan:`Hadist ini diriwayatkan oleh Imam Bukhari dan Imam Muslim dari sahabat Abu Hurairah radhiyallahu 'anhu. Hadist ini menjelaskan lima perkara yang termasuk fitrah manusia dalam menjaga kebersihan diri.

Pengertian Fitrah:
Fitrah adalah naluri alami yang Allah tanamkan dalam diri manusia untuk menjaga kesucian dan kebersihan. Lima perkara ini adalah sunnah para nabi sejak Nabi Ibrahim 'alaihissalam.

Penjelasan Lima Fitrah:
1. Khitan: Memotong kulit yang menutupi kepala kemaluan (bagi laki-laki). Hukumnya wajib bagi laki-laki dan sunnah bagi perempuan menurut mayoritas ulama.

2. Istihdad: Mencukur atau menghilangkan bulu kemaluan. Bisa dengan mencukur, mencabut, atau cara lain yang aman.

3. Memendekkan Kumis: Agar tidak mengganggu saat makan dan minum, serta menjaga penampilan.

4. Memotong Kuku: Agar kuku tidak menjadi tempat bersarangnya kotoran dan kuman.

5. Mencabut Bulu Ketiak: Bisa dengan mencabut, mencukur, atau cara lain. Bertujuan menghilangkan bau tidak sedap.

Rasulullah SAW memberikan batas waktu maksimal 40 hari untuk melakukan perkara-perkara ini (selain khitan).`,pelajaran:["Islam sangat memperhatikan kebersihan dan penampilan diri","Lima perkara fitrah ini adalah sunnah para nabi","Menjaga kebersihan tubuh adalah bagian dari naluri manusia","Khitan memiliki hikmah kesehatan dan kebersihan","Kebersihan mencakup seluruh bagian tubuh","Batas waktu maksimal mengabaikan fitrah adalah 40 hari","Penampilan yang bersih dan rapi mencerminkan keimanan","Fitrah ini berlaku untuk laki-laki dan perempuan"],contohPengamalan:["Melaksanakan khitan bagi anak laki-laki","Memotong kuku minimal sekali seminggu","Merapikan kumis secara teratur (bagi laki-laki)","Membersihkan bulu ketiak secara rutin","Mencukur atau membersihkan bulu kemaluan","Tidak membiarkan kuku panjang lebih dari 40 hari","Menjaga kebersihan seluruh anggota tubuh","Mengajarkan kebersihan fitrah kepada anak"],kesimpulan:"Hadist ini mengajarkan lima fitrah kebersihan yang harus dijaga oleh setiap Muslim: khitan, mencukur bulu kemaluan, memendekkan kumis, memotong kuku, dan mencabut bulu ketiak. Perkara-perkara ini adalah sunnah para nabi dan mencerminkan perhatian Islam terhadap kebersihan serta kesehatan diri."},{id:"kebersihan-4",judul:"Keutamaan Bersiwak (Menyikat Gigi)",arab:"السِّوَاكُ مَطْهَرَةٌ لِلْفَمِ، مَرْضَاةٌ لِلرَّبِّ",latin:"As-siwāku maṭharatun lil-fam, marḍātun lir-rabb",arti:"Siwak itu membersihkan mulut dan menyebabkan keridhaan Tuhan.",perawi:"HR. Nasa'i no. 5, Ahmad no. 24317, dari Aisyah radhiyallahu 'anha",kualitas:"Shahih",kosaKata:[{arab:"السِّوَاكُ",latin:"As-Siwak",arti:"Siwak/Sikat gigi"},{arab:"مَطْهَرَةٌ",latin:"Mathharah",arti:"Pembersih"},{arab:"لِلْفَمِ",latin:"Lil-Fam",arti:"Untuk mulut"},{arab:"مَرْضَاةٌ",latin:"Mardhah",arti:"Penyebab ridha"},{arab:"لِلرَّبِّ",latin:"Lir-Rabb",arti:"Bagi Tuhan"}],penjelasan:`Hadist ini diriwayatkan oleh Imam An-Nasa'i dan Imam Ahmad dari Ummul Mukminin Aisyah radhiyallahu 'anha.

Siwak adalah kayu yang berasal dari pohon Arak (Salvadora persica) yang digunakan untuk membersihkan gigi dan mulut. Rasulullah SAW sangat menganjurkan penggunaan siwak hingga beliau bersabda: "Kalau bukan karena akan memberatkan umatku, niscaya aku perintahkan mereka untuk bersiwak setiap akan shalat."

Keistimewaan Siwak:
1. Membersihkan mulut dari kotoran dan sisa makanan
2. Menghilangkan bau mulut
3. Menguatkan gusi
4. Memutihkan gigi
5. Melancarkan air liur
6. Mendatangkan ridha Allah SWT

Waktu-waktu yang dianjurkan bersiwak:
- Sebelum shalat
- Sebelum membaca Al-Quran
- Ketika bangun tidur
- Ketika masuk rumah
- Ketika bau mulut berubah

Hukum bersiwak adalah sunnah muakkadah (sunnah yang sangat dianjurkan). Siwak bisa diganti dengan sikat gigi modern yang memiliki fungsi serupa dalam membersihkan gigi dan mulut.`,pelajaran:["Islam sangat memperhatikan kebersihan mulut dan gigi","Bersiwak/menyikat gigi mendatangkan ridha Allah","Kebersihan mulut adalah bagian dari kebersihan diri","Rasulullah SAW sangat menganjurkan penggunaan siwak","Bersiwak adalah sunnah yang sangat dianjurkan","Mulut yang bersih lebih baik untuk beribadah","Sikat gigi modern bisa menggantikan siwak","Ada waktu-waktu tertentu yang dianjurkan untuk bersiwak"],contohPengamalan:["Menyikat gigi minimal dua kali sehari","Membersihkan gigi sebelum shalat","Menyikat gigi sebelum membaca Al-Quran","Menyikat gigi saat bangun tidur","Menggunakan siwak jika tersedia","Menjaga kesehatan gigi dengan rutin ke dokter gigi","Membersihkan lidah dari kotoran","Menggunakan obat kumur untuk menyegarkan mulut","Mengajarkan anak untuk rajin menyikat gigi"],kesimpulan:"Hadist ini mengajarkan pentingnya menjaga kebersihan mulut dan gigi. Bersiwak atau menyikat gigi tidak hanya bermanfaat untuk kesehatan, tetapi juga mendatangkan ridha Allah SWT. Ini menunjukkan bahwa Islam adalah agama yang sangat memperhatikan kebersihan dalam setiap aspek kehidupan."},{id:"kebersihan-5",judul:"Membuang Gangguan dari Jalan",arab:"الْإِيمَانُ بِضْعٌ وَسَبْعُونَ شُعْبَةً، فَأَفْضَلُهَا قَوْلُ لَا إِلَهَ إِلَّا اللَّهُ، وَأَدْنَاهَا إِمَاطَةُ الْأَذَى عَنِ الطَّرِيقِ، وَالْحَيَاءُ شُعْبَةٌ مِنَ الْإِيمَانِ",latin:"Al-īmānu biḍ'un wa sab'ūna syu'bah, fa afḍaluhā qaulul lā ilāha illallāh, wa adnāhā imāṭatul-ażā 'anit-ṭarīq, wal-ḥayā'u syu'batun minal-īmān",arti:"Iman itu ada tujuh puluh sekian cabang. Yang paling utama adalah ucapan Laa ilaaha illallah, dan yang paling rendah adalah menyingkirkan gangguan dari jalan. Dan malu adalah cabang dari iman.",perawi:"HR. Bukhari no. 9 dan Muslim no. 35, dari Abu Hurairah radhiyallahu 'anhu",kualitas:"Muttafaq 'Alaih (Shahih)",kosaKata:[{arab:"الْإِيمَانُ",latin:"Al-Iman",arti:"Iman"},{arab:"بِضْعٌ وَسَبْعُونَ",latin:"Bidh'un wa sab'un",arti:"Tujuh puluh sekian"},{arab:"شُعْبَةً",latin:"Syu'bah",arti:"Cabang"},{arab:"أَفْضَلُهَا",latin:"Afdhaluha",arti:"Yang paling utama"},{arab:"أَدْنَاهَا",latin:"Adnaha",arti:"Yang paling rendah"},{arab:"إِمَاطَةُ",latin:"Imathah",arti:"Menyingkirkan"},{arab:"الْأَذَى",latin:"Al-Adza",arti:"Gangguan"},{arab:"الطَّرِيقِ",latin:"Ath-Thariq",arti:"Jalan"},{arab:"الْحَيَاءُ",latin:"Al-Haya'",arti:"Malu"}],penjelasan:`Hadist ini diriwayatkan oleh Imam Bukhari dan Imam Muslim dari sahabat Abu Hurairah radhiyallahu 'anhu.

Hadist ini menjelaskan bahwa iman memiliki banyak cabang (lebih dari 70 cabang) yang meliputi:
1. Cabang tertinggi: Mengucapkan kalimat tauhid "Laa ilaaha illallah"
2. Cabang terendah: Menyingkirkan gangguan dari jalan
3. Cabang penting lainnya: Sifat malu

Yang menarik adalah hadist ini menyebutkan bahwa menyingkirkan gangguan dari jalan (yang termasuk menjaga kebersihan lingkungan) adalah bagian dari iman, meskipun disebut sebagai cabang yang "paling rendah". Ini menunjukkan bahwa tidak ada amal kebaikan yang terlalu kecil di mata Allah.

Gangguan di jalan bisa berupa:
- Sampah dan kotoran
- Batu atau benda yang menghalangi
- Duri atau benda tajam
- Lubang yang membahayakan
- Apapun yang bisa mengganggu pengguna jalan

Menyingkirkan gangguan ini adalah bentuk kepedulian sosial dan termasuk sedekah.`,pelajaran:["Iman mencakup banyak cabang, dari yang tertinggi hingga terendah","Menyingkirkan gangguan dari jalan adalah bagian dari iman","Tidak ada amal kebaikan yang terlalu kecil","Menjaga kebersihan jalan adalah ibadah","Sifat malu adalah tanda keimanan","Islam mengajarkan kepedulian sosial","Kebersihan lingkungan adalah tanggung jawab bersama","Amal kecil yang konsisten lebih baik dari amal besar yang tidak konsisten"],contohPengamalan:["Memungut sampah yang ada di jalan","Menyingkirkan batu atau benda yang menghalangi jalan","Tidak membuang sampah di jalan","Membersihkan got dan saluran air","Melaporkan jalan rusak kepada pihak berwenang","Ikut serta dalam program kebersihan lingkungan","Menegur dengan baik orang yang membuang sampah sembarangan","Menyediakan tempat sampah di tempat-tempat strategis","Mengajarkan anak untuk menjaga kebersihan jalan dan lingkungan"],kesimpulan:"Hadist ini mengajarkan bahwa iman memiliki banyak cabang, mulai dari yang paling tinggi (kalimat tauhid) hingga yang paling rendah (menyingkirkan gangguan dari jalan). Meskipun disebut paling rendah, menyingkirkan gangguan dari jalan tetap termasuk cabang iman dan merupakan bentuk kepedulian sosial yang dihargai dalam Islam. Ini menunjukkan bahwa Islam sangat memperhatikan kebersihan lingkungan."}];function qf(){const[d,j]=vn.useState(Mc[0]),[v,b]=vn.useState("riwayat"),E=[{id:"riwayat",label:"Riwayat Hadist"},{id:"lafaz",label:"Melafalkan Hadist"},{id:"kosakata",label:"Kosa Kata"},{id:"pelajaran",label:"Pelajaran"},{id:"pengamalan",label:"Contoh Pengamalan"},{id:"kesimpulan",label:"Kesimpulan"}];return u.jsxs("div",{className:"space-y-6",children:[u.jsxs("div",{className:"bg-gradient-to-r from-sky-600 to-blue-600 rounded-2xl p-6 text-white",children:[u.jsx("h1",{className:"text-2xl md:text-3xl font-bold mb-2",children:"🧼 Hadist Tentang Kebersihan"}),u.jsx("p",{className:"opacity-90",children:"Mempelajari h
