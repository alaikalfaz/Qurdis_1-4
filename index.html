**Latar Belakang Peristiwa:**
Abrahah Al-Asyram adalah gubernur Yaman yang diangkat oleh Raja Najasyi dari Habasyah (Ethiopia). Ia membangun gereja megah bernama Al-Qullais di Shan'a untuk menyaingi Ka'bah dan mengalihkan perhatian bangsa Arab dari Ka'bah.

Namun rencana Abrahah gagal. Bangsa Arab tetap setia berhaji ke Ka'bah. Bahkan ada orang Arab yang mengotori gereja tersebut sebagai bentuk penghinaan. Hal ini membuat Abrahah marah dan bertekad menghancurkan Ka'bah.

**Pasukan Gajah Berangkat:**
Abrahah memimpin pasukan besar dengan gajah-gajah perang, termasuk gajah besar bernama Mahmud. Pasukan ini sangat kuat dan belum pernah terkalahkan.

Ketika sampai di luar Makkah, pasukan Abrahah merampas unta-unta penduduk termasuk 200 ekor unta milik Abdul Muthalib (kakek Nabi Muhammad SAW). Abdul Muthalib menemui Abrahah untuk meminta untanya kembali.

Abrahah heran: "Aku datang untuk menghancurkan Ka'bah yang kamu agungkan, tapi kamu hanya meminta unta?"

Abdul Muthalib menjawab dengan tenang: "Aku adalah pemilik unta, maka aku menuntut untaku. Adapun Ka'bah, ia memiliki Tuhan yang akan melindunginya."

**Mukjizat Allah:**
Ketika pasukan gajah hendak memasuki Makkah, gajah Mahmud berlutut dan menolak maju ke arah Ka'bah. Kemudian Allah mengirimkan burung Ababil yang membawa batu-batu panas dari neraka (sijjil). Setiap batu mengenai prajurit dan membunuhnya. Pasukan Abrahah hancur lebur, dan Abrahah sendiri meninggal dalam perjalanan pulang.

Peristiwa ini terjadi 50 atau 55 hari sebelum kelahiran Nabi Muhammad SAW.`,pelajaran:["Allah Maha Kuasa melindungi Ka'bah dari serangan musuh","Kekuatan militer terbesar pun tidak ada artinya di hadapan Allah","Allah memiliki tentara yang tidak terlihat (burung Ababil)","Orang yang berniat jahat terhadap rumah Allah akan dihancurkan","Peristiwa ini menjadi tanda kelahiran Nabi Muhammad SAW","Yakin kepada pertolongan Allah seperti Abdul Muthalib","Kesombongan dan keangkuhan akan berakhir dengan kehancuran","Ka'bah adalah rumah Allah yang dilindungi hingga akhir zaman"],kesimpulan:"Surat Al-Fil adalah surat ke-105 dalam Al-Quran yang menceritakan kisah pasukan gajah yang dipimpin Abrahah yang hendak menghancurkan Ka'bah. Allah menghancurkan mereka dengan mengirim burung Ababil yang melempari batu panas. Peristiwa ini menunjukkan kekuasaan Allah dalam melindungi rumah-Nya dan menjadi tanda akan segera lahirnya Nabi Muhammad SAW. Pelajaran utamanya adalah bahwa kekuatan apapun tidak ada artinya di hadapan kekuasaan Allah."},ek={id:"al-humazah",nama:"Al-Humazah",namaArab:"الهمزة",arti:"Pengumpat",jumlahAyat:9,tempatTurun:"Makkah (Makkiyah)",urutan:104,ayat:[{nomor:1,arab:"وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍ",latin:"Wailul likulli humazatil lumazah",terjemahan:"Celakalah bagi setiap pengumpat dan pencela."},{nomor:2,arab:"الَّذِي جَمَعَ مَالًا وَعَدَّدَهُ",latin:"Allażī jama'a mālaw wa'addadah",terjemahan:"Yang mengumpulkan harta dan menghitung-hitungnya."},{nomor:3,arab:"يَحْسَبُ أَنَّ مَالَهُ أَخْلَدَهُ",latin:"Yaḥsabu anna mālahū akhladah",terjemahan:"Dia (manusia) mengira bahwa hartanya itu dapat mengekalkannya."},{nomor:4,arab:"كَلَّا ۖ لَيُنبَذَنَّ فِي الْحُطَمَةِ",latin:"Kallā layunbażanna fil-ḥuṭamah",terjemahan:"Sekali-kali tidak! Pasti dia akan dilemparkan ke dalam (neraka) Huthamah."},{nomor:5,arab:"وَمَا أَدْرَاكَ مَا الْحُطَمَةُ",latin:"Wa mā adrāka mal-ḥuṭamah",terjemahan:"Dan tahukah kamu apa (neraka) Huthamah itu?"},{nomor:6,arab:"نَارُ اللَّهِ الْمُوقَدَةُ",latin:"Nārullāhil-mūqadah",terjemahan:"(Yaitu) api (azab) Allah yang dinyalakan."},{nomor:7,arab:"الَّتِي تَطَّلِعُ عَلَى الْأَفْئِدَةِ",latin:"Allatī taṭṭali'u 'alal-af'idah",terjemahan:"Yang (membakar) naik sampai ke hati."},{nomor:8,arab:"إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌ",latin:"Innahā 'alaihim mu'ṣadah",terjemahan:"Sungguh, api itu ditutup rapat atas mereka."},{nomor:9,arab:"فِي عَمَدٍ مُّمَدَّدَةٍ",latin:"Fī 'amadim mumaddadah",terjemahan:"(Mereka diikat) pada tiang-tiang yang panjang."}],kosaKata:[{arab:"وَيْلٌ",latin:"Wail",arti:"Celakalah/kesengsaraan"},{arab:"هُمَزَةٍ",latin:"Humazah",arti:"Pengumpat/pencela"},{arab:"لُّمَزَةٍ",latin:"Lumazah",arti:"Pencela/penggunjing"},{arab:"جَمَعَ",latin:"Jama'a",arti:"Mengumpulkan"},{arab:"مَالًا",latin:"Malan",arti:"Harta"},{arab:"عَدَّدَهُ",latin:"'Addadah",arti:"Menghitung-hitungnya"},{arab:"أَخْلَدَهُ",latin:"Akhladah",arti:"Mengekalkannya"},{arab:"الْحُطَمَةِ",latin:"Al-Huthamah",arti:"Neraka yang menghancurkan"},{arab:"الْمُوقَدَةُ",latin:"Al-Muqadah",arti:"Yang dinyalakan"},{arab:"الْأَفْئِدَةِ",latin:"Al-Af'idah",arti:"Hati-hati"},{arab:"مُّؤْصَدَةٌ",latin:"Mu'shadah",arti:"Ditutup rapat"},{arab:"عَمَدٍ",latin:"'Amad",arti:"Tiang-tiang"}],asbabunNuzul:`Surat Al-Humazah turun berkaitan dengan orang-orang yang suka mengumpat, mencela, dan terlalu mencintai harta.

**Pendapat Pertama:**
Surat ini turun berkaitan dengan Al-Akhnas bin Syariq Ats-Tsaqafi yang suka mencela dan mengumpat orang lain, termasuk mencela Rasulullah SAW.

**Pendapat Kedua:**
Surat ini turun berkaitan dengan Umayyah bin Khalaf yang suka mengumpat Rasulullah SAW dan sangat bangga dengan kekayaannya.

**Pendapat Ketiga:**
Surat ini turun berkaitan dengan Al-Walid bin Al-Mughirah yang sering mencela Nabi SAW di belakang dan mengumpat di hadapan orang banyak.

**Pendapat Keempat:**
Surat ini bersifat umum, mencakup semua orang yang memiliki sifat:
1. **Humazah** - Orang yang suka mencela dengan isyarat, seperti dengan mata, tangan, atau gerakan kepala
2. **Lumazah** - Orang yang suka mencela dengan lisan, baik secara langsung maupun menggunjing

Kedua sifat ini sering disertai dengan sifat cinta harta yang berlebihan dan kesombongan. Mereka mengira harta dapat menyelamatkan dan mengekalkan mereka di dunia.

Hukuman bagi mereka adalah neraka Huthamah yang apinya membakar hingga ke hati, ditutup rapat tanpa bisa keluar, dan mereka diikat pada tiang-tiang panjang.`,pelajaran:["Mengumpat dan mencela adalah dosa besar yang diancam neraka","Humazah (mencela dengan isyarat) sama buruknya dengan Lumazah (mencela dengan lisan)","Harta tidak akan mengekalkan manusia di dunia","Cinta harta yang berlebihan dapat menyebabkan kesombongan","Neraka Huthamah adalah azab yang sangat pedih","Menjaga lisan dan perilaku dari mencela orang lain","Harta harus digunakan untuk kebaikan, bukan untuk kesombongan","Tidak boleh menghina orang lain baik secara terang-terangan maupun tersembunyi"],kesimpulan:"Surat Al-Humazah adalah surat ke-104 dalam Al-Quran yang berisi ancaman keras bagi orang yang suka mengumpat, mencela, dan terlalu mencintai harta. Humazah adalah orang yang mencela dengan isyarat, sedangkan Lumazah adalah pencela dengan lisan. Mereka diancam dengan neraka Huthamah yang apinya membakar hingga ke hati dan ditutup rapat. Pelajaran utamanya adalah pentingnya menjaga lisan dan perilaku serta tidak terperdaya oleh harta dunia."},lk={id:"al-asr",nama:"Al-Asr",namaArab:"العصر",arti:"Masa/Waktu",jumlahAyat:3,tempatTurun:"Makkah (Makkiyah)",urutan:103,ayat:[{nomor:1,arab:"وَالْعَصْرِ",latin:"Wal-'aṣr",terjemahan:"Demi masa."},{nomor:2,arab:"إِنَّ الْإِنسَانَ لَفِي خُسْرٍ",latin:"Innal-insāna lafī khusr",terjemahan:"Sungguh, manusia berada dalam kerugian."},{nomor:3,arab:"إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَتَوَاصَوْا بِالْحَقِّ وَتَوَاصَوْا بِالصَّبْرِ",latin:"Illallażīna āmanū wa 'amiluṣ-ṣāliḥāti wa tawāṣau bil-ḥaqqi wa tawāṣau biṣ-ṣabr",terjemahan:"Kecuali orang-orang yang beriman dan mengerjakan kebajikan serta saling menasihati untuk kebenaran dan saling menasihati untuk kesabaran."}],kosaKata:[{arab:"وَالْعَصْرِ",latin:"Wal-'Ashr",arti:"Demi masa/waktu"},{arab:"إِنَّ",latin:"Inna",arti:"Sesungguhnya"},{arab:"الْإِنسَانَ",latin:"Al-Insan",arti:"Manusia"},{arab:"لَفِي",latin:"Lafi",arti:"Benar-benar dalam"},{arab:"خُسْرٍ",latin:"Khusr",arti:"Kerugian"},{arab:"إِلَّا",latin:"Illa",arti:"Kecuali"},{arab:"الَّذِينَ",latin:"Alladzina",arti:"Orang-orang yang"},{arab:"آمَنُوا",latin:"Amanu",arti:"Beriman"},{arab:"عَمِلُوا",latin:"'Amilu",arti:"Mengerjakan"},{arab:"الصَّالِحَاتِ",latin:"Ash-Shalihat",arti:"Amal saleh"},{arab:"تَوَاصَوْا",latin:"Tawashau",arti:"Saling menasihati"},{arab:"بِالْحَقِّ",latin:"Bil-Haqq",arti:"Dengan kebenaran"},{arab:"بِالصَّبْرِ",latin:"Bish-Shabr",arti:"Dengan kesabaran"}],asbabunNuzul:`Surat Al-Asr tidak memiliki asbabun nuzul yang khusus (spesifik). Surat ini turun di Makkah sebagai peringatan umum kepada seluruh manusia tentang pentingnya memanfaatkan waktu.

**Makna Al-'Asr:**
Para mufassir berbeda pendapat tentang makna "Al-'Asr":
1. **Waktu Ashar** - Waktu shalat Ashar yang merupakan waktu penting
2. **Masa/Zaman** - Waktu secara umum sepanjang kehidupan manusia
3. **Dahr (Masa)** - Perjalanan waktu dari awal hingga akhir
4. **Shalat Ashar** - Shalat wustha (pertengahan) yang sangat penting

**Keistimewaan Surat Al-Asr:**
Imam Asy-Syafi'i berkata: "Seandainya manusia merenungkan surat ini saja, niscaya cukup bagi mereka." Maksudnya, surat ini meskipun sangat pendek, tetapi mengandung petunjuk lengkap untuk keselamatan manusia.

Diriwayatkan bahwa para sahabat tidak berpisah dari suatu majelis kecuali setelah membaca surat Al-Asr sebagai pengingat.`,pelajaran:["Waktu adalah nikmat yang sangat berharga dan harus dimanfaatkan","Semua manusia dalam kerugian kecuali yang memenuhi 4 syarat","Syarat pertama: Beriman kepada Allah dan rukun iman lainnya","Syarat kedua: Beramal saleh (ibadah dan kebaikan)","Syarat ketiga: Saling menasihati dalam kebenaran (dakwah)","Syarat keempat: Saling menasihati dalam kesabaran","Keempat syarat ini harus dipenuhi untuk selamat dari kerugian","Iman tanpa amal tidak cukup, amal tanpa iman juga tidak cukup","Dakwah dan kesabaran adalah pelengkap keimanan dan amal saleh"],kesimpulan:"Surat Al-Asr adalah surat ke-103 dalam Al-Quran yang terdiri dari 3 ayat. Meskipun sangat pendek, surat ini mengandung formula lengkap keselamatan manusia. Allah bersumpah dengan waktu bahwa semua manusia dalam kerugian, kecuali mereka yang memenuhi 4 syarat: (1) Beriman, (2) Beramal saleh, (3) Saling menasihati dalam kebenaran, dan (4) Saling menasihati dalam kesabaran. Imam Asy-Syafi'i menyatakan bahwa surat ini saja cukup sebagai petunjuk bagi manusia."},tk={id:"at-takatsur",nama:"At-Takatsur",namaArab:"التكاثر",arti:"Bermegah-megahan",jumlahAyat:8,tempatTurun:"Makkah (Makkiyah)",urutan:102,ayat:[{nomor:1,arab:"أَلْهَاكُمُ التَّكَاثُرُ",latin:"Alhākumut-takāṡur",terjemahan:"Bermegah-megahan telah melalaikan kamu."},{nomor:2,arab:"حَتَّىٰ زُرْتُمُ الْمَقَابِرَ",latin:"Ḥattā zurtumul-maqābir",terjemahan:"Sampai kamu masuk ke dalam kubur."},{nomor:3,arab:"كَلَّا سَوْفَ تَعْلَمُونَ",latin:"Kallā saufa ta'lamūn",terjemahan:"Sekali-kali tidak! Kelak kamu akan mengetahui (akibat perbuatanmu itu)."},{nomor:4,arab:"ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ",latin:"Ṡumma kallā saufa ta'lamūn",terjemahan:"Kemudian sekali-kali tidak! Kelak kamu akan mengetahui."},{nomor:5,arab:"كَلَّا لَوْ تَعْلَمُونَ عِلْمَ الْيَقِينِ",latin:"Kallā lau ta'lamūna 'ilmal-yaqīn",terjemahan:"Sekali-kali tidak! Sekiranya kamu mengetahui dengan pasti."},{nomor:6,arab:"لَتَرَوُنَّ الْجَحِيمَ",latin:"Latarawunnal-jaḥīm",terjemahan:"Niscaya kamu benar-benar akan melihat neraka Jahim."},{nomor:7,arab:"ثُمَّ لَتَرَوُنَّهَا عَيْنَ الْيَقِينِ",latin:"Ṡumma latarawunnahā 'ainal-yaqīn",terjemahan:"Kemudian kamu benar-benar akan melihatnya dengan mata kepala sendiri."},{nomor:8,arab:"ثُمَّ لَتُسْأَلُنَّ يَوْمَئِذٍ عَنِ النَّعِيمِ",latin:"Ṡumma latus'alunna yauma'iżin 'anin-na'īm",terjemahan:"Kemudian kamu benar-benar akan ditanya pada hari itu tentang kenikmatan (yang megah di dunia itu)."}],kosaKata:[{arab:"أَلْهَاكُمُ",latin:"Alhakum",arti:"Telah melalaikan kamu"},{arab:"التَّكَاثُرُ",latin:"At-Takatsur",arti:"Bermegah-megahan"},{arab:"حَتَّىٰ",latin:"Hatta",arti:"Sampai"},{arab:"زُرْتُمُ",latin:"Zurtum",arti:"Kamu masuk/mengunjungi"},{arab:"الْمَقَابِرَ",latin:"Al-Maqabir",arti:"Kubur-kubur"},{arab:"كَلَّا",latin:"Kalla",arti:"Sekali-kali tidak"},{arab:"سَوْفَ",latin:"Saufa",arti:"Kelak/akan"},{arab:"تَعْلَمُونَ",latin:"Ta'lamun",arti:"Kamu mengetahui"},{arab:"عِلْمَ الْيَقِينِ",latin:"'Ilmal-Yaqin",arti:"Pengetahuan yang yakin"},{arab:"الْجَحِيمَ",latin:"Al-Jahim",arti:"Neraka Jahim"},{arab:"عَيْنَ الْيَقِينِ",latin:"'Ainal-Yaqin",arti:"Keyakinan dengan mata"},{arab:"النَّعِيمِ",latin:"An-Na'im",arti:"Kenikmatan"}],asbabunNuzul:`Surat At-Takatsur turun berkaitan dengan fenomena bermegah-megahan yang terjadi di kalangan masyarakat Arab.

**Pendapat Pertama:**
Surat ini turun berkaitan dengan dua kabilah dari Quraisy, yaitu Bani Abdi Manaf dan Bani Sahm yang saling berbangga-bangga tentang jumlah dan kemuliaan kabilah mereka. Mereka bahkan menghitung orang-orang yang sudah meninggal di kuburan untuk menunjukkan siapa yang lebih banyak.

**Pendapat Kedua:**
Surat ini turun berkaitan dengan orang-orang Yahudi yang bermegah-megah tentang kekayaan, anak, dan keturunan mereka.

**Pendapat Ketiga:**
Surat ini bersifat umum, mencakup semua manusia yang terlalu sibuk dengan kemegahan dunia:
- Bermegah-megah dengan harta benda
- Bermegah-megah dengan anak dan keturunan
- Bermegah-megah dengan jabatan dan kedudukan
- Bermegah-megah dengan ilmu pengetahuan duniawi

Semua bentuk bermegah-megahan ini melalaikan manusia dari tujuan utama penciptaan, yaitu beribadah kepada Allah. Kelak di akhirat, manusia akan ditanya tentang semua nikmat yang pernah dirasakannya di dunia.`,pelajaran:["Bermegah-megahan melalaikan manusia dari mengingat Allah dan akhirat","Kelalaian ini berlangsung sampai manusia masuk kubur","Peringatan akan datang, tapi sering kali sudah terlambat","Tingkatan keyakinan: Ilmul Yaqin, Ainul Yaqin, Haqqul Yaqin","Semua manusia akan melihat neraka Jahim","Setiap nikmat akan dipertanyakan di akhirat","Harta, anak, dan jabatan tidak boleh melalaikan dari ibadah","Menggunakan nikmat untuk taat kepada Allah adalah cara bersyukur yang benar"],kesimpulan:"Surat At-Takatsur adalah surat ke-102 dalam Al-Quran yang memperingatkan manusia dari bahaya bermegah-megahan. Banyak manusia terlena dengan kemegahan dunia (harta, anak, jabatan) hingga melupakan akhirat sampai mati. Allah memperingatkan bahwa kelak manusia akan melihat neraka dan ditanya tentang semua nikmat dunia. Surat ini mengajarkan untuk tidak terperdaya oleh kemegahan dunia dan selalu mengingat akhirat."},ik={id:"al-qariah",nama:"Al-Qari'ah",namaArab:"القارعة",arti:"Hari Kiamat",jumlahAyat:11,tempatTurun:"Makkah (Makkiyah)",urutan:101,ayat:[{nomor:1,arab:"الْقَارِعَةُ",latin:"Al-qāri'ah",terjemahan:"Hari Kiamat."},{nomor:2,arab:"مَا الْقَارِعَةُ",latin:"Mal-qāri'ah",terjemahan:"Apakah hari Kiamat itu?"},{nomor:3,arab:"وَمَا أَدْرَاكَ مَا الْقَارِعَةُ",latin:"Wa mā adrāka mal-qāri'ah",terjemahan:"Dan tahukah kamu apakah hari Kiamat itu?"},{nomor:4,arab:"يَوْمَ يَكُونُ النَّاسُ كَالْفَرَاشِ الْمَبْثُوثِ",latin:"Yauma yakūnun-nāsu kal-farāsyil-mabṡūṡ",terjemahan:"(Yaitu) pada hari (ketika) manusia seperti laron yang bertebaran."},{nomor:5,arab:"وَتَكُونُ الْجِبَالُ كَالْعِهْنِ الْمَنفُوشِ",latin:"Wa takūnul-jibālu kal-'ihnil-manfūsy",terjemahan:"Dan gunung-gunung seperti bulu yang dihambur-hamburkan."},{nomor:6,arab:"فَأَمَّا مَن ثَقُلَتْ مَوَازِينُهُ",latin:"Fa ammā man ṡaqulat mawāzīnuh",terjemahan:"Maka adapun orang yang berat timbangan (kebaikan)nya."},{nomor:7,arab:"فَهُوَ فِي عِيشَةٍ رَّاضِيَةٍ",latin:"Fahuwa fī 'īsyatir-rāḍiyah",terjemahan:"Maka dia berada dalam kehidupan yang memuaskan (senang)."},{nomor:8,arab:"وَأَمَّا مَنْ خَفَّتْ مَوَازِينُهُ",latin:"Wa ammā man khaffat mawāzīnuh",terjemahan:"Dan adapun orang yang ringan timbangan (kebaikan)nya."},{nomor:9,arab:"فَأُمُّهُ هَاوِيَةٌ",latin:"Fa ummuhū hāwiyah",terjemahan:"Maka tempat kembalinya adalah neraka Hawiyah."},{nomor:10,arab:"وَمَا أَدْرَاكَ مَا هِيَهْ",latin:"Wa mā adrāka mā hiyah",terjemahan:"Dan tahukah kamu apakah (neraka Hawiyah) itu?"},{nomor:11,arab:"نَارٌ حَامِيَةٌ",latin:"Nārun ḥāmiyah",terjemahan:"(Yaitu) api yang sangat panas."}],kosaKata:[{arab:"الْقَارِعَةُ",latin:"Al-Qari'ah",arti:"Yang menggetarkan (Hari Kiamat)"},{arab:"أَدْرَاكَ",latin:"Adraka",arti:"Memberitahumu"},{arab:"الْفَرَاشِ",latin:"Al-Farasy",arti:"Laron/kupu-kupu"},{arab:"الْمَبْثُوثِ",latin:"Al-Mabtsuts",arti:"Yang bertebaran"},{arab:"الْجِبَالُ",latin:"Al-Jibal",arti:"Gunung-gunung"},{arab:"الْعِهْنِ",latin:"Al-'Ihn",arti:"Bulu/kapas"},{arab:"الْمَنفُوشِ",latin:"Al-Manfusy",arti:"Yang dihambur-hamburkan"},{arab:"ثَقُلَتْ",latin:"Tsaqulat",arti:"Berat"},{arab:"مَوَازِينُهُ",latin:"Mawazinuhu",arti:"Timbangannya"},{arab:"خَفَّتْ",latin:"Khaffat",arti:"Ringan"},{arab:"هَاوِيَةٌ",latin:"Hawiyah",arti:"Jurang yang dalam (neraka)"},{arab:"حَامِيَةٌ",latin:"Hamiyah",arti:"Yang sangat panas"}],asbabunNuzul:`Surat Al-Qari'ah tidak memiliki asbabun nuzul yang spesifik. Surat ini turun sebagai peringatan tentang dahsyatnya hari kiamat.

**Makna Al-Qari'ah:**
Al-Qari'ah berasal dari kata "qara'a" yang berarti memukul dengan keras atau menggetarkan. Hari Kiamat disebut Al-Qari'ah karena:
1. Menggetarkan hati dengan ketakutan
2. Bunyi yang sangat menggelegar
3. Menghancurkan segala sesuatu

**Penggambaran Hari Kiamat:**
1. Manusia seperti laron yang bertebaran - kebingungan, tak tentu arah
2. Gunung-gunung seperti bulu yang dihambur - kokohnya gunung menjadi tidak berarti

**Penimbangan Amal:**
Di hari itu, setiap manusia akan ditimbang amalnya:
- Yang berat timbangannya (kebaikan lebih banyak) → Surga yang memuaskan
- Yang ringan timbangannya (keburukan lebih banyak) → Neraka Hawiyah

**Neraka Hawiyah:**
Disebut "ummuh" (ibunya) karena tempat kembali seseorang, seperti anak kembali kepada ibunya. Neraka ini adalah api yang sangat panas.`,pelajaran:["Hari Kiamat adalah peristiwa yang sangat dahsyat dan menggetarkan","Pada hari itu, manusia akan kebingungan seperti laron bertebaran","Gunung-gunung yang kokoh akan hancur seperti bulu yang dihambur","Setiap amal manusia akan ditimbang dengan adil","Orang yang berat timbangannya akan masuk surga yang memuaskan","Orang yang ringan timbangannya akan masuk neraka Hawiyah","Neraka Hawiyah adalah api yang sangat panas","Pentingnya memperbanyak amal kebaikan untuk memberatkan timbangan"],kesimpulan:"Surat Al-Qari'ah adalah surat ke-101 dalam Al-Quran yang menggambarkan dahsyatnya hari kiamat. Al-Qari'ah berarti yang menggetarkan, menggambarkan betapa mengerikannya hari itu. Manusia akan seperti laron yang bertebaran, dan gunung-gunung seperti bulu yang dihambur. Setiap orang akan ditimbang amalnya: yang berat akan masuk surga, yang ringan akan masuk neraka Hawiyah yang sangat panas. Surat ini memotivasi untuk memperbanyak amal kebaikan."},uk={id:"al-adiyat",nama:"Al-'Adiyat",namaArab:"العاديات",arti:"Kuda Perang yang Berlari Kencang",jumlahAyat:11,tempatTurun:"Makkah (Makkiyah)",urutan:100,ayat:[{nomor:1,arab:"وَالْعَادِيَاتِ ضَبْحًا",latin:"Wal-'ādiyāti ḍabḥā",terjemahan:"Demi kuda perang yang berlari kencang dengan terengah-engah."},{nomor:2,arab:"فَالْمُورِيَاتِ قَدْحًا",latin:"Fal-mūriyāti qadḥā",terjemahan:"Dan kuda yang mencetuskan api dengan pukulan (kuku kakinya)."},{nomor:3,arab:"فَالْمُغِيرَاتِ صُبْحًا",latin:"Fal-mugīrāti ṣubḥā",terjemahan:"Dan kuda yang menyerang di waktu pagi."},{nomor:4,arab:"فَأَثَرْنَ بِهِ نَقْعًا",latin:"Fa aṡarna bihī naq'ā",terjemahan:"Maka ia menerbangkan debu."},{nomor:5,arab:"فَوَسَطْنَ بِهِ جَمْعًا",latin:"Fa wasaṭna bihī jam'ā",terjemahan:"Dan menyerbu ke tengah-tengah kumpulan musuh."},{nomor:6,arab:"إِنَّ الْإِنسَانَ لِرَبِّهِ لَكَنُودٌ",latin:"Innal-insāna lirabbihī lakanūd",terjemahan:"Sesungguhnya manusia itu sangat ingkar kepada Tuhannya."},{nomor:7,arab:"وَإِنَّهُ عَلَىٰ ذَٰلِكَ لَشَهِيدٌ",latin:"Wa innahū 'alā żālika lasyahīd",terjemahan:"Dan sesungguhnya dia (manusia) menyaksikan (sendiri) keingkarannya."},{nomor:8,arab:"وَإِنَّهُ لِحُبِّ الْخَيْرِ لَشَدِيدٌ",latin:"Wa innahū liḥubbil-khairi lasyadīd",terjemahan:"Dan sesungguhnya dia (manusia) sangat cinta kepada harta."},{nomor:9,arab:"أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ",latin:"Afalā ya'lamu iżā bu'ṡira mā fil-qubūr",terjemahan:"Maka tidakkah dia mengetahui apabila apa yang di dalam kubur dikeluarkan."},{nomor:10,arab:"وَحُصِّلَ مَا فِي الصُّدُورِ",latin:"Wa ḥuṣṣila mā fiṣ-ṣudūr",terjemahan:"Dan apa yang tersimpan di dalam dada dilahirkan."},{nomor:11,arab:"إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرٌ",latin:"Inna rabbahum bihim yauma'iżil lakhābīr",terjemahan:"Sungguh, Tuhan mereka pada hari itu Maha Mengetahui keadaan mereka."}],kosaKata:[{arab:"الْعَادِيَاتِ",latin:"Al-'Adiyat",arti:"Kuda yang berlari kencang"},{arab:"ضَبْحًا",latin:"Dabha",arti:"Terengah-engah"},{arab:"الْمُورِيَاتِ",latin:"Al-Muriyat",arti:"Yang mencetuskan api"},{arab:"قَدْحًا",latin:"Qadha",arti:"Dengan pukulan"},{arab:"الْمُغِيرَاتِ",latin:"Al-Mughirat",arti:"Yang menyerang"},{arab:"نَقْعًا",latin:"Naq'a",arti:"Debu"},{arab:"جَمْعًا",latin:"Jam'a",arti:"Kumpulan"},{arab:"كَنُودٌ",latin:"Kanud",arti:"Sangat ingkar/tidak berterima kasih"},{arab:"شَهِيدٌ",latin:"Syahid",arti:"Saksi"},{arab:"الْخَيْرِ",latin:"Al-Khair",arti:"Harta/kebaikan"},{arab:"بُعْثِرَ",latin:"Bu'tsira",arti:"Dikeluarkan"},{arab:"خَبِيرٌ",latin:"Khabir",arti:"Maha Mengetahui"}],asbabunNuzul:`Surat Al-'Adiyat tidak memiliki asbabun nuzul yang spesifik. Surat ini turun di Makkah sebagai peringatan tentang sifat buruk manusia.

**Makna Al-'Adiyat:**
Mayoritas ulama menafsirkan Al-'Adiyat adalah kuda-kuda perang yang:
1. Berlari kencang dengan napas terengah-engah
2. Memercikkan bunga api dari batu yang terkena kuku kakinya
3. Menyerang musuh di waktu pagi
4. Menerbangkan debu
5. Menyerbu ke tengah pasukan musuh

**Hikmah Sumpah dengan Kuda Perang:**
Allah bersumpah dengan kuda perang untuk:
1. Menunjukkan kekuatan dan ketaatan kuda kepada tuannya
2. Membandingkan dengan manusia yang justru ingkar kepada Tuhannya
3. Kuda taat kepada tuannya, sementara banyak manusia tidak taat kepada Allah

**Sifat Buruk Manusia:**
Setelah bersumpah, Allah menjelaskan sifat buruk manusia:
1. Kanud (sangat ingkar/tidak bersyukur)
2. Menyaksikan sendiri keingkarannya
3. Sangat cinta kepada harta`,pelajaran:["Kuda yang patuh kepada tuannya sebagai contoh ketaatan","Manusia sering kali ingkar kepada Allah yang menciptakannya","Sifat kanud (tidak bersyukur) adalah sifat tercela","Cinta harta yang berlebihan dapat menyebabkan keingkaran","Manusia menyaksikan sendiri keingkarannya tapi tetap melakukannya","Isi kubur akan dikeluarkan di hari kiamat","Isi hati akan dibongkar dan dihisab","Allah Maha Mengetahui keadaan setiap manusia"],kesimpulan:"Surat Al-'Adiyat adalah surat ke-100 dalam Al-Quran. Allah bersumpah dengan kuda perang yang taat dan pemberani untuk membandingkan dengan manusia yang justru ingkar kepada Tuhannya. Manusia memiliki sifat buruk: sangat ingkar (kanud), menyaksikan keingkarannya sendiri, dan sangat cinta harta. Di hari kiamat, isi kubur akan dikeluarkan dan isi hati akan dibongkar. Pelajaran utamanya adalah kita harus lebih taat kepada Allah daripada hewan yang taat kepada tuannya."},rk={id:"al-zalzalah",nama:"Al-Zalzalah",namaArab:"الزلزلة",arti:"Kegoncangan",jumlahAyat:8,tempatTurun:"Madinah (Madaniyah)",urutan:99,ayat:[{nomor:1,arab:"إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا",latin:"Iżā zulzilatil-arḍu zilzālahā",terjemahan:"Apabila bumi diguncangkan dengan guncangan yang dahsyat."},{nomor:2,arab:"وَأَخْرَجَتِ الْأَرْضُ أَثْقَالَهَا",latin:"Wa akhrajatil-arḍu aṡqālahā",terjemahan:"Dan bumi telah mengeluarkan beban-beban berat (yang dikandung)nya."},{nomor:3,arab:"وَقَالَ الْإِنسَانُ مَا لَهَا",latin:"Wa qālal-insānu mā lahā",terjemahan:'Dan manusia bertanya, "Apa yang terjadi pada bumi ini?"'},{nomor:4,arab:"يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا",latin:"Yauma'iżin tuḥaddiṡu akhbārahā",terjemahan:"Pada hari itu bumi menyampaikan beritanya."},{nomor:5,arab:"بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا",latin:"Bi anna rabbaka auḥā lahā",terjemahan:"Karena sesungguhnya Tuhanmu telah memerintahkan (yang demikian itu) kepadanya."},{nomor:6,arab:"يَوْمَئِذٍ يَصْدُرُ النَّاسُ أَشْتَاتًا لِّيُرَوْا أَعْمَالَهُمْ",latin:"Yauma'iżiy yaṣdurun-nāsu asytātal liyuraw a'mālahum",terjemahan:"Pada hari itu manusia keluar dari kuburnya dalam keadaan berkelompok-kelompok, untuk diperlihatkan kepada mereka (balasan) semua perbuatannya."},{nomor:7,arab:"فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ",latin:"Famay ya'mal miṡqāla żarratin khairay yarah",terjemahan:"Maka barangsiapa mengerjakan kebaikan seberat zarrah, niscaya dia akan melihat (balasan)nya."},{nomor:8,arab:"وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ",latin:"Wa may ya'mal miṡqāla żarratin syarray yarah",terjemahan:"Dan barangsiapa mengerjakan kejahatan seberat zarrah, niscaya dia akan melihat (balasan)nya."}],kosaKata:[{arab:"زُلْزِلَتِ",latin:"Zulzilat",arti:"Diguncangkan"},{arab:"الْأَرْضُ",latin:"Al-Ardh",arti:"Bumi"},{arab:"زِلْزَالَهَا",latin:"Zilzalaha",arti:"Guncangan yang dahsyat"},{arab:"أَخْرَجَتِ",latin:"Akhrajat",arti:"Mengeluarkan"},{arab:"أَثْقَالَهَا",latin:"Atsqalaha",arti:"Beban-beban beratnya"},{arab:"تُحَدِّثُ",latin:"Tuhaddits",arti:"Menyampaikan berita"},{arab:"أَخْبَارَهَا",latin:"Akhbaraha",arti:"Berita-beritanya"},{arab:"أَوْحَىٰ",latin:"Auha",arti:"Mewahyukan/memerintahkan"},{arab:"أَشْتَاتًا",latin:"Asytata",arti:"Berkelompok-kelompok"},{arab:"مِثْقَالَ",latin:"Mitsqal",arti:"Seberat"},{arab:"ذَرَّةٍ",latin:"Dzarrah",arti:"Zarrah (atom/debu kecil)"},{arab:"خَيْرًا",latin:"Khairan",arti:"Kebaikan"},{arab:"شَرًّا",latin:"Syarran",arti:"Kejahatan"}],asbabunNuzul:`Surat Al-Zalzalah tidak memiliki asbabun nuzul yang spesifik terkait satu peristiwa. Namun ada beberapa riwayat yang berkaitan dengan ayat 7-8:

**Riwayat Pertama:**
Ketika ayat "Faman ya'mal mitsqala dzarratin khairan yarah" turun, ada seorang sahabat yang bertanya kepada Rasulullah SAW tentang sedekah yang kecil. Rasulullah SAW menjawab bahwa meskipun kecil, Allah tetap mencatatnya dan akan memberikan balasannya.

**Riwayat Kedua:**
Beberapa sahabat merasa bahwa pahala hanya diberikan untuk amal besar. Ayat ini turun untuk menjelaskan bahwa amal sekecil apapun akan dibalas, baik kebaikan maupun keburukan.

**Penjelasan Umum:**
Surat ini menggambarkan peristiwa hari kiamat:
1. Bumi diguncang dengan dahsyat
2. Bumi mengeluarkan isinya (mayat-mayat, harta yang terpendam)
3. Bumi menjadi saksi atas perbuatan manusia di atasnya
4. Manusia keluar dari kubur berkelompok-kelompok
5. Setiap amal sekecil apapun akan diperlihatkan balasannya`,pelajaran:["Hari kiamat ditandai dengan guncangan bumi yang dahsyat","Bumi akan mengeluarkan semua isinya dan menjadi saksi","Bumi menyimpan catatan semua perbuatan manusia","Manusia akan bangkit dari kubur untuk menerima balasan","Setiap kebaikan sekecil apapun akan dibalas","Setiap keburukan sekecil apapun juga akan dibalas","Tidak ada amal yang sia-sia di hadapan Allah","Perbanyak amal kebaikan meskipun kecil"],kesimpulan:"Surat Al-Zalzalah adalah surat ke-99 dalam Al-Quran yang menggambarkan peristiwa hari kiamat. Bumi akan diguncang dahsyat, mengeluarkan isinya, dan menjadi saksi atas perbuatan manusia. Pesan terpenting dari surat ini adalah ayat 7-8: setiap amal kebaikan seberat zarrah (atom) akan diberi balasan, dan setiap keburukan seberat zarrah juga akan dibalas. Ini mengajarkan bahwa tidak ada amal yang sia-sia, sehingga kita harus memperbanyak kebaikan meskipun kecil dan menjauhi keburukan meskipun tampak sepele."},sk={id:"al-bayyinah",nama:"Al-Bayyinah",namaArab:"البينة",arti:"Bukti yang Nyata",jumlahAyat:8,tempatTurun:"Madinah (Madaniyah)",urutan:98,ayat:[{nomor:1,arab:"لَمْ يَكُنِ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ الْبَيِّنَةُ",latin:"Lam yakunillażīna kafarū min ahlil-kitābi wal-musyrikīna munfakkīna ḥattā ta'tiyahumul-bayyinah",terjemahan:"Orang-orang yang kafir dari golongan Ahli Kitab dan orang-orang musyrik tidak akan meninggalkan (agama mereka) sampai datang kepada mereka bukti yang nyata."},{nomor:2,arab:"رَسُولٌ مِّنَ اللَّهِ يَتْلُو صُحُفًا مُّطَهَّرَةً",latin:"Rasūlum minallāhi yatlū ṣuḥufam muṭahharah",terjemahan:"(Yaitu) seorang Rasul dari Allah yang membacakan lembaran-lembaran yang suci (Al-Quran)."},{nomor:3,arab:"فِيهَا كُتُبٌ قَيِّمَةٌ",latin:"Fīhā kutubun qayyimah",terjemahan:"Di dalamnya terdapat (isi) kitab-kitab yang lurus (benar)."},{nomor:4,arab:"وَمَا تَفَرَّقَ الَّذِينَ أُوتُوا الْكِتَابَ إِلَّا مِن بَعْدِ مَا جَاءَتْهُمُ الْبَيِّنَةُ",latin:"Wa mā tafarraqallażīna ūtul-kitāba illā mim ba'di mā jā'athumul-bayyinah",terjemahan:"Dan tidaklah terpecah belah orang-orang yang telah diberi Kitab (Taurat dan Injil) kecuali setelah bukti yang nyata itu datang kepada mereka."},{nomor:5,arab:"وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ وَيُقِيمُوا الصَّلَاةَ وَيُؤْتُوا الزَّكَاةَ ۚ وَذَٰلِكَ دِينُ الْقَيِّمَةِ",latin:"Wa mā umirū illā liya'budullāha mukhliṣīna lahud-dīna ḥunafā'a wa yuqīmuṣ-ṣalāta wa yu'tuz-zakāh, wa żālika dīnul-qayyimah",terjemahan:"Padahal mereka hanya diperintah menyembah Allah dengan ikhlas menaati-Nya semata-mata karena (menjalankan) agama, dan juga agar melaksanakan salat dan menunaikan zakat; dan yang demikian itulah agama yang lurus (benar)."},{nomor:6,arab:"إِنَّ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ فِي نَارِ جَهَنَّمَ خَالِدِينَ فِيهَا ۚ أُولَٰئِكَ هُمْ شَرُّ الْبَرِيَّةِ",latin:"Innallażīna kafarū min ahlil-kitābi wal-musyrikīna fī nāri jahannama khālidīna fīhā, ulā'ika hum syarrul-bariyyah",terjemahan:"Sungguh, orang-orang yang kafir dari golongan Ahli Kitab dan orang-orang musyrik (akan masuk) ke dalam neraka Jahanam, mereka kekal di dalamnya selama-lamanya. Mereka itu adalah seburuk-buruk makhluk."},{nomor:7,arab:"إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ أُولَٰئِكَ هُمْ خَيْرُ الْبَرِيَّةِ",latin:"Innallażīna āmanū wa 'amiluṣ-ṣāliḥāti ulā'ika hum khairul-bariyyah",terjemahan:"Sungguh, orang-orang yang beriman dan mengerjakan kebajikan, mereka itu adalah sebaik-baik makhluk."},{nomor:8,arab:"جَزَاؤُهُمْ عِندَ رَبِّهِمْ جَنَّاتُ عَدْنٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا ۖ رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ ۚ ذَٰلِكَ لِمَنْ خَشِيَ رَبَّهُ",latin:"Jaza'uhum 'inda rabbihim jannatu 'adnin tajri min tahtihal-anharu khalidina fiha abada, radiyallahu 'anhum wa radu 'anh, dzalika liman khasyiya rabbah",terjemahan:"Balasan mereka di sisi Tuhan mereka ialah surga Adn yang mengalir di bawahnya sungai-sungai; mereka kekal di dalamnya selama-lamanya. Allah rida terhadap mereka dan mereka pun rida kepada-Nya. Yang demikian itu adalah (balasan) bagi orang yang takut kepada Tuhannya."}],kosaKata:[{arab:"كَفَرُوا",latin:"Kafaru",arti:"Orang-orang kafir"},{arab:"أَهْلِ الْكِتَابِ",latin:"Ahlil-Kitab",arti:"Ahli Kitab (Yahudi & Nasrani)"},{arab:"الْمُشْرِكِينَ",latin:"Al-Musyrikin",arti:"Orang-orang musyrik"},{arab:"الْبَيِّنَةُ",latin:"Al-Bayyinah",arti:"Bukti yang nyata"},{arab:"صُحُفًا",latin:"Shuhuf",arti:"Lembaran-lembaran"},{arab:"مُطَهَّرَةً",latin:"Mutahharah",arti:"Yang suci"},{arab:"قَيِّمَةٌ",latin:"Qayyimah",arti:"Yang lurus/benar"},{arab:"مُخْلِصِينَ",latin:"Mukhlisin",arti:"Dengan ikhlas"},{arab:"حُنَفَاءَ",latin:"Hunafa'",arti:"Lurus (dalam agama)"},{arab:"الْبَرِيَّةِ",latin:"Al-Bariyyah",arti:"Makhluk"},{arab:"جَنَّاتُ عَدْنٍ",latin:"Jannat 'Adn",arti:"Surga Adn"},{arab:"خَشِيَ",latin:"Khasyiya",arti:"Takut"}],asbabunNuzul:`Surat Al-Bayyinah turun di Madinah berkaitan dengan sikap Ahli Kitab dan kaum musyrikin terhadap datangnya Nabi Muhammad SAW.

**Latar Belakang:**
Sebelum kedatangan Nabi Muhammad SAW, Ahli Kitab (Yahudi dan Nasrani) mengetahui dari kitab mereka tentang akan datangnya seorang nabi akhir zaman. Mereka bahkan menggunakan ini untuk mengancam kaum musyrik Arab.

Namun ketika Nabi Muhammad SAW datang dengan bukti yang nyata (Al-Bayyinah), yaitu Al-Quran, mereka justru menolak dan terpecah belah. Sebagian dari mereka beriman, tapi mayoritas kafir karena:
1. Dengki bahwa nabi terakhir bukan dari kalangan mereka
2. Takut kehilangan kedudukan dan kekuasaan
3. Sombong untuk mengikuti orang yang mereka anggap lebih rendah

**Perintah dalam Agama:**
Padahal perintah dalam semua agama samawi sama:
1. Menyembah Allah dengan ikhlas
2. Lurus dalam beragama (hanif)
3. Mendirikan shalat
4. Menunaikan zakat

Inilah agama yang lurus (Dinul Qayyimah).`,pelajaran:["Al-Quran dan Nabi Muhammad SAW adalah bukti nyata kebenaran Islam","Ahli Kitab menolak Islam karena dengki dan sombong, bukan karena tidak tahu","Perintah utama dalam agama: ikhlas menyembah Allah, shalat, dan zakat","Orang kafir adalah seburuk-buruk makhluk dan akan kekal di neraka","Orang beriman dan beramal saleh adalah sebaik-baik makhluk","Balasan orang beriman adalah surga dengan ridha Allah","Takut kepada Allah adalah kunci kebahagiaan di akhirat","Islam adalah agama yang lurus (Dinul Qayyimah)"],kesimpulan:"Surat Al-Bayyinah adalah surat ke-98 dalam Al-Quran yang membahas tentang sikap Ahli Kitab dan kaum musyrikin terhadap datangnya bukti yang nyata (Nabi Muhammad SAW dan Al-Quran). Meskipun mereka sudah mengetahui dari kitab-kitab terdahulu, mereka justru menolak karena dengki dan sombong. Surat ini menegaskan bahwa perintah utama dalam agama adalah ikhlas menyembah Allah, mendirikan shalat, dan menunaikan zakat. Orang kafir adalah seburuk-buruk makhluk, sedangkan orang beriman adalah sebaik-baik makhluk yang akan mendapat surga dan ridha Allah."},dk={id:"ghunnah",judul:"Bacaan Ghunnah",pengertian:`Ghunnah (غُنَّة) secara bahasa berarti "dengung" atau "sengau". Secara istilah, Ghunnah adalah suara dengung yang keluar dari pangkal hidung (khaisyum) ketika melafalkan huruf Nun (ن) dan Mim (م) dalam keadaan tertentu.

Kadar panjang Ghunnah adalah 2 harakat (setara dengan mengucapkan dua huruf berharakat). Ghunnah merupakan salah satu hukum tajwid yang sangat penting untuk mempercantik bacaan Al-Quran.`,aturan:["Ghunnah terjadi pada huruf Nun (ن) dan Mim (م) yang bertasydid","Ghunnah juga terjadi pada hukum Idgham Bighunnah","Ghunnah terjadi pada hukum Iqlab","Ghunnah terjadi pada hukum Ikhfa Haqiqi","Ghunnah terjadi pada hukum Ikhfa Syafawi","Panjang Ghunnah adalah 2 harakat","Suara Ghunnah keluar dari pangkal hidung (khaisyum)"],contoh:[{arab:"إِنَّ",latin:"Inna",penjelasan:"Nun bertasydid, dibaca dengan dengung 2 harakat"},{arab:"ثُمَّ",latin:"Tsumma",penjelasan:"Mim bertasydid, dibaca dengan dengung 2 harakat"},{arab:"مِنْ مَاءٍ",latin:"Min maa-in",penjelasan:"Idgham Mimi, Nun sukun bertemu Mim"},{arab:"مَنْ يَقُولُ",latin:"May yaqulu",penjelasan:"Idgham Bighunnah, Nun sukun bertemu Ya"},{arab:"مِنْ بَعْدِ",latin:"Mim ba'di",penjelasan:"Iqlab, Nun sukun bertemu Ba"},{arab:"مِنْ ذَا",latin:"Min dza",penjelasan:"Ikhfa, Nun sukun bertemu Dzal"},{arab:"أَنْعَمْتَ",latin:"An'amta",penjelasan:"Ikhfa, Nun sukun bertemu Ain"}],rumus:`RUMUS MENCARI BACAAN GHUNNAH:
1. Cari huruf Nun (ن) atau Mim (م) yang bertasydid (ّ)
2. Cari Nun sukun atau Tanwin yang bertemu huruf Idgham Bighunnah (ي ن م و)
3. Cari Nun sukun atau Tanwin yang bertemu huruf Ba (ب) - Iqlab
4. Cari Nun sukun atau Tanwin yang bertemu 15 huruf Ikhfa
5. Cari Mim sukun yang bertemu Mim atau Ba

Jika memenuhi salah satu kondisi di atas, bacalah dengan DENGUNG selama 2 harakat.`,kesimpulan:"Ghunnah adalah bacaan dengung yang keluar dari pangkal hidung selama 2 harakat. Ghunnah terjadi pada: (1) Nun dan Mim bertasydid, (2) Idgham Bighunnah, (3) Iqlab, (4) Ikhfa Haqiqi, dan (5) Ikhfa Syafawi. Menguasai Ghunnah sangat penting karena termasuk bacaan yang sering muncul dalam Al-Quran."},mk={id:"al-qamariyah-syamsiyah",judul:"Bacaan Al-Qamariyah dan Al-Syamsiyah",pengertian:`Bacaan Al-Qamariyah dan Al-Syamsiyah berkaitan dengan cara membaca huruf Lam (ل) pada kata sandang "Al" (ال) ketika bertemu dengan huruf-huruf tertentu.

**Al-Qamariyah (القمرية):**
Secara bahasa berarti "seperti bulan" (dari kata Qamar = bulan). Al-Qamariyah adalah bacaan di mana huruf Lam pada "Al" dibaca jelas/terang (izhar).

**Al-Syamsiyah (الشمسية):**
Secara bahasa berarti "seperti matahari" (dari kata Syams = matahari). Al-Syamsiyah adalah bacaan di mana huruf Lam pada "Al" tidak dibaca/diidghamkan ke huruf setelahnya.`,huruf:[{huruf:"ا",nama:"Alif (Qamariyah)"},{huruf:"ب",nama:"Ba (Qamariyah)"},{huruf:"ج",nama:"Jim (Qamariyah)"},{huruf:"ح",nama:"Ha (Qamariyah)"},{huruf:"خ",nama:"Kha (Qamariyah)"},{huruf:"ع",nama:"Ain (Qamariyah)"},{huruf:"غ",nama:"Ghain (Qamariyah)"},{huruf:"ف",nama:"Fa (Qamariyah)"},{huruf:"ق",nama:"Qaf (Qamariyah)"},{huruf:"ك",nama:"Kaf (Qamariyah)"},{huruf:"م",nama:"Mim (Qamariyah)"},{huruf:"و",nama:"Wau (Qamariyah)"},{huruf:"ه",nama:"Ha (Qamariyah)"},{huruf:"ي",nama:"Ya (Qamariyah)"},{huruf:"ت",nama:"Ta (Syamsiyah)"},{huruf:"ث",nama:"Tsa (Syamsiyah)"},{huruf:"د",nama:"Dal (Syamsiyah)"},{huruf:"ذ",nama:"Dzal (Syamsiyah)"},{huruf:"ر",nama:"Ra (Syamsiyah)"},{huruf:"ز",nama:"Zai (Syamsiyah)"},{huruf:"س",nama:"Sin (Syamsiyah)"},{huruf:"ش",nama:"Syin (Syamsiyah)"},{huruf:"ص",nama:"Shad (Syamsiyah)"},{huruf:"ض",nama:"Dhad (Syamsiyah)"},{huruf:"ط",nama:"Tha (Syamsiyah)"},{huruf:"ظ",nama:"Zha (Syamsiyah)"},{huruf:"ل",nama:"Lam (Syamsiyah)"},{huruf:"ن",nama:"Nun (Syamsiyah)"}],contoh:[{arab:"الْقَمَرُ",latin:"Al-Qamar",penjelasan:"Qamariyah - Lam dibaca jelas karena bertemu Qaf"},{arab:"الْكِتَابُ",latin:"Al-Kitab",penjelasan:"Qamariyah - Lam dibaca jelas karena bertemu Kaf"},{arab:"الْحَمْدُ",latin:"Al-Hamdu",penjelasan:"Qamariyah - Lam dibaca jelas karena bertemu Ha"},{arab:"الْعَالَمِينَ",latin:"Al-'Alamin",penjelasan:"Qamariyah - Lam dibaca jelas karena bertemu Ain"},{arab:"الشَّمْسُ",latin:"Asy-Syams",penjelasan:"Syamsiyah - Lam diidghamkan karena bertemu Syin"},{arab:"الرَّحْمَنِ",latin:"Ar-Rahman",penjelasan:"Syamsiyah - Lam diidghamkan karena bertemu Ra"},{arab:"النَّاسِ",latin:"An-Nas",penjelasan:"Syamsiyah - Lam diidghamkan karena bertemu Nun"},{arab:"الصَّلَاةَ",latin:"Ash-Shalat",penjelasan:"Syamsiyah - Lam diidghamkan karena bertemu Shad"}],rumus:`RUMUS MENENTUKAN BACAAN AL-QAMARIYAH DAN AL-SYAMSIYAH:

HURUF QAMARIYAH (14 huruf) - Lam DIBACA JELAS:
ا ب ج ح خ ع غ ف ق ك م و ه ي
Cara menghafal: "IBGHII HAJJAKA WA KHOF 'AQIIMAHU"
(ابغ حجك وخف عقيمه)

HURUF SYAMSIYAH (14 huruf) - Lam TIDAK DIBACA:
ت ث د ذ ر ز س ش ص ض ط ظ ل ن
Cara menghafal: Huruf-huruf yang ada di awal kata:
"طِبْ ثُمَّ صِلْ رَحِمًا تَفُزْ ضِفْ ذَا نِعَمْ دَعْ سُوءَ ظَنٍّ زُرْ شَرِيفًا لِلْكَرَمِ"

CARA MUDAH:
- Jika setelah "ال" ada TASYDID pada huruf pertama = SYAMSIYAH
- Jika setelah "ال" TIDAK ada TASYDID = QAMARIYAH`,kesimpulan:'Al-Qamariyah dan Al-Syamsiyah adalah hukum membaca Lam pada kata sandang "ال". Al-Qamariyah (14 huruf) dibaca dengan Lam yang jelas, sedangkan Al-Syamsiyah (14 huruf) dibaca dengan Lam yang diidghamkan. Cara mudah membedakannya: jika huruf setelah "Al" bertasydid berarti Syamsiyah, jika tidak bertasydid berarti Qamariyah.'},hk={id:"qalqalah",judul:"Bacaan Qalqalah",pengertianTajwid:`**Pengertian Ilmu Tajwid:**
Tajwid secara bahasa berasal dari kata "jawwada - yujawwidu - tajwidan" yang berarti membaguskan atau memperbaiki.

Secara istilah, Ilmu Tajwid adalah ilmu yang mempelajari cara membaca Al-Quran dengan benar dan fasih, sesuai dengan kaidah-kaidah yang telah ditetapkan. Ilmu tajwid mencakup:
1. Makharijul Huruf - Tempat keluarnya huruf
2. Sifatul Huruf - Sifat-sifat huruf
3. Ahkamul Huruf - Hukum-hukum bacaan huruf
4. Ahkamul Mad - Hukum bacaan panjang
5. Ahkamul Waqf wal Ibtida' - Hukum berhenti dan memulai

Hukum mempelajari ilmu tajwid adalah fardhu kifayah, sedangkan mengamalkannya (membaca Al-Quran dengan tajwid) adalah fardhu 'ain.`,pengertian:`**Pengertian Qalqalah:**
Qalqalah (قَلْقَلَة) secara bahasa berarti "goncangan" atau "getaran". Secara istilah, Qalqalah adalah suara memantul/bergetar yang terjadi ketika melafalkan salah satu dari 5 huruf Qalqalah dalam keadaan sukun.

Huruf Qalqalah ada 5, disingkat dengan "قُطْبُ جَدٍ" (Quthbu Jadin):
ق - ط - ب - ج - د
(Qaf - Tha - Ba - Jim - Dal)`,pembagian:[{nama:"Qalqalah Sughra (Kecil)",penjelasan:"Qalqalah yang terjadi ketika huruf Qalqalah sukun berada di tengah kata. Pantulannya lebih ringan.",contoh:["يَقْتُلُونَ","أَفَلَمْ يَدَّبَّرُوا","يَجْعَلُونَ"]},{nama:"Qalqalah Kubra (Besar)",penjelasan:"Qalqalah yang terjadi ketika huruf Qalqalah sukun berada di akhir kata karena waqaf (berhenti). Pantulannya lebih jelas dan kuat.",contoh:["الْفَلَقْ","تَبَّ","الصَّمَدْ","مَسَدْ","لَهَبْ"]}],contoh:[{arab:"يَقْطَعُونَ",latin:"Yaq-tha-un",penjelasan:"Qalqalah Sughra pada huruf Qaf sukun di tengah kata"},{arab:"يَجْعَلُونَ",latin:"Yaj-alun",penjelasan:"Qalqalah Sughra pada huruf Jim sukun di tengah kata"},{arab:"أَبْوَابًا",latin:"Ab-waban",penjelasan:"Qalqalah Sughra pada huruf Ba sukun di tengah kata"},{arab:"الْفَلَقْ",latin:"Al-Falaq",penjelasan:"Qalqalah Kubra pada huruf Qaf di akhir saat waqaf"},{arab:"لَهَبْ",latin:"Lahab",penjelasan:"Qalqalah Kubra pada huruf Ba di akhir saat waqaf"},{arab:"الصَّمَدْ",latin:"Ash-Shamad",penjelasan:"Qalqalah Kubra pada huruf Dal di akhir saat waqaf"},{arab:"مُحِيطْ",latin:"Muhith",penjelasan:"Qalqalah Kubra pada huruf Tha di akhir saat waqaf"}],rumus:`RUMUS MENENTUKAN BACAAN QALQALAH:

1. CARI HURUF QALQALAH: ق ط ب ج د (Quthbu Jadin)
2. PASTIKAN HURUF TERSEBUT SUKUN (mati)
3. TENTUKAN POSISINYA:
   - Di TENGAH kata = Qalqalah SUGHRA (ringan)
   - Di AKHIR kata saat WAQAF = Qalqalah KUBRA (kuat)

CARA MELAFALKAN:
- Suara memantul/bergetar
- Tidak boleh ada tambahan huruf
- Qalqalah Kubra lebih jelas pantulannya

INGAT: Huruf Qalqalah yang berharakat (tidak sukun) TIDAK dibaca Qalqalah.`,kesimpulan:"Qalqalah adalah suara memantul/bergetar yang terjadi pada 5 huruf (ق ط ب ج د) ketika dalam keadaan sukun. Qalqalah terbagi dua: Sughra (kecil) jika huruf Qalqalah sukun di tengah kata, dan Kubra (besar) jika huruf Qalqalah sukun di akhir kata saat waqaf. Menguasai Qalqalah penting karena dapat mengubah makna jika tidak dibaca dengan benar."},ck={id:"mad-thabii",judul:"Hukum Bacaan Mad Thabi'i",pengertianTajwid:`**Pengertian Ilmu Tajwid:**
Ilmu Tajwid adalah ilmu yang mempelajari cara membaca Al-Quran sesuai dengan kaidah-kaidah yang telah ditetapkan, meliputi makharijul huruf (tempat keluar huruf), sifatul huruf (sifat-sifat huruf), dan hukum-hukum bacaan lainnya.

**Pengertian Mad:**
Mad secara bahasa berarti "panjang" atau "tambahan". Secara istilah, Mad adalah memanjangkan suara ketika melafalkan huruf mad. Mad terbagi menjadi dua:
1. Mad Asli/Thabi'i - Mad yang panjangnya 2 harakat
2. Mad Far'i - Mad cabang yang panjangnya lebih dari 2 harakat`,pengertian:`**Pengertian Mad Thabi'i:**
Mad Thabi'i (مَدٌّ طَبِيْعِي) disebut juga Mad Asli. Thabi'i berarti "alami" atau "asli". Mad Thabi'i adalah mad yang panjangnya 2 harakat tanpa ada sebab tambahan.

**Huruf Mad ada 3:**
1. Alif sukun (ا) setelah fathah
2. Wau sukun (و) setelah dhammah  
3. Ya sukun (ي) setelah kasrah

**Syarat Mad Thabi'i:**
- Setelah huruf mad TIDAK ada hamzah
- Setelah huruf mad TIDAK ada huruf sukun/tasydid`,aturan:["Panjang bacaan Mad Thabi'i adalah 2 harakat (1 alif)","Huruf Alif sukun didahului huruf yang berbaris fathah","Huruf Wau sukun didahului huruf yang berbaris dhammah","Huruf Ya sukun didahului huruf yang berbaris kasrah","Tidak boleh dipanjangkan lebih dari 2 harakat","Tidak boleh dipendekkan kurang dari 2 harakat","Disebut juga Mad Asli karena tidak bergantung pada sebab lain"],contoh:[{arab:"قَالَ",latin:"Qaala",penjelasan:"Fathah bertemu Alif, dibaca panjang 2 harakat"},{arab:"يَقُولُ",latin:"Yaquulu",penjelasan:"Dhammah bertemu Wau sukun, dibaca panjang 2 harakat"},{arab:"قِيلَ",latin:"Qiila",penjelasan:"Kasrah bertemu Ya sukun, dibaca panjang 2 harakat"},{arab:"نُوحِي",latin:"Nuuhii",penjelasan:"Dhammah+Wau dan Kasrah+Ya, keduanya 2 harakat"},{arab:"الرَّحِيمِ",latin:"Ar-Rahiimi",penjelasan:"Kasrah+Ya sukun = Mad Thabi'i 2 harakat"},{arab:"الْعَالَمِينَ",latin:"Al-'Aalamiina",penjelasan:"Fathah+Alif dan Kasrah+Ya = 2 harakat"},{arab:"نَعْبُدُ",latin:"Na'budu",penjelasan:"Tidak ada Mad karena tidak ada huruf mad"}],rumus:`RUMUS MENENTUKAN MAD THABI'I:

1. CARI HURUF MAD: ا و ي (Alif, Wau, Ya)
2. CEK HURUF SEBELUMNYA:
   - Alif harus didahului FATHAH (ـَ)
   - Wau harus didahului DHAMMAH (ـُ)
   - Ya harus didahului KASRAH (ـِ)
3. CEK HURUF SESUDAHNYA:
   - TIDAK ada HAMZAH → tetap Mad Thabi'i
   - TIDAK ada SUKUN/TASYDID → tetap Mad Thabi'i
4. PANJANG BACAAN: 2 HARAKAT

FORMULA SINGKAT:
فَـ + ا = MAD THABI'I (contoh: قَا)
ضُـ + و = MAD THABI'I (contoh: قُو)
كِـ + ي = MAD THABI'I (contoh: قِي)

Jika setelah huruf mad ada hamzah atau sukun, maka berubah menjadi Mad Far'i.`,kesimpulan:"Mad Thabi'i adalah bacaan panjang dasar yang terjadi ketika huruf mad (Alif, Wau, Ya sukun) bertemu dengan harakat yang sesuai (Fathah, Dhammah, Kasrah) tanpa ada sebab tambahan. Panjangnya 2 harakat dan tidak boleh ditambah atau dikurangi. Mad Thabi'i adalah fondasi untuk memahami jenis-jenis mad lainnya (Mad Far'i)."},bk={id:"iqlab",judul:"Bacaan Iqlab",pengertian:`**Pengertian Iqlab:**
Iqlab (إِقْلَاب) secara bahasa berarti "menukar" atau "mengubah". Secara istilah, Iqlab adalah mengubah bunyi Nun sukun (نْ) atau Tanwin menjadi bunyi Mim (م) ketika bertemu dengan huruf Ba (ب), disertai dengan dengung (ghunnah) selama 2 harakat.

**Huruf Iqlab:**
Hanya ada 1 huruf, yaitu: ب (Ba)

**Cara Membaca:**
Nun sukun/Tanwin diubah bunyinya menjadi Mim, lalu didengungkan selama 2 harakat sebelum huruf Ba.`,aturan:["Nun sukun atau Tanwin bertemu huruf Ba (ب)","Bunyi Nun/Tanwin diubah menjadi bunyi Mim","Bibir dikatupkan seperti mengucapkan Mim","Didengungkan (ghunnah) selama 2 harakat","Dalam mushaf ditandai dengan huruf Mim kecil (مـ) di atas Nun","Berlaku untuk Nun sukun dan semua jenis Tanwin"],contoh:[{arab:"مِنْ بَعْدِ",latin:"Mim ba'di",penjelasan:`Nun sukun bertemu Ba, dibaca "mim-ba'di" dengan dengung`},{arab:"أَنْبِئْهُمْ",latin:"Ambi'hum",penjelasan:`Nun sukun bertemu Ba, dibaca "am-bi'hum" dengan dengung`},{arab:"يُنْبِتُ",latin:"Yumbitu",penjelasan:'Nun sukun bertemu Ba, dibaca "yum-bitu" dengan dengung'},{arab:"سَمِيعٌ بَصِيرٌ",latin:"Sami'um Bashir",penjelasan:`Tanwin bertemu Ba, dibaca "sami'um-bashir" dengan dengung`},{arab:"عَلِيمٌ بِذَاتِ",latin:"'Alimum bidzati",penjelasan:`Tanwin bertemu Ba, dibaca "'alimum-bidzati" dengan dengung`},{arab:"مِنْ بَيْنِ",latin:"Mim baini",penjelasan:'Nun sukun bertemu Ba, dibaca "mim-baini" dengan dengung'}],rumus:`RUMUS MENCARI BACAAN IQLAB:

1. CARI Nun sukun (نْ) atau Tanwin (ـًـٍـٌ)
2. CEK huruf SETELAHNYA
3. Jika hurufnya BA (ب) = IQLAB

CARA MEMBACA:
- Ubah bunyi Nun/Tanwin menjadi MIM
- Katupkan kedua bibir
- Dengungkan selama 2 HARAKAT
- Lanjutkan dengan huruf Ba

TANDA DI MUSHAF:
Di beberapa mushaf, Iqlab ditandai dengan huruf Mim kecil (مـ) di atas Nun sukun.

INGAT: Iqlab hanya terjadi jika bertemu huruf BA. Tidak ada huruf lain yang menyebabkan Iqlab.`,kesimpulan:"Iqlab adalah hukum tajwid yang terjadi ketika Nun sukun atau Tanwin bertemu huruf Ba. Cara membacanya adalah dengan mengubah bunyi Nun/Tanwin menjadi bunyi Mim, kemudian didengungkan selama 2 harakat. Iqlab hanya memiliki satu huruf pemicu yaitu Ba (ب). Mudah diingat karena hanya satu huruf."},gk={id:"izhar",judul:"Bacaan Izhar",pengertian:`**Pengertian Izhar:**
Izhar (إِظْهَار) secara bahasa berarti "jelas" atau "terang". Secara istilah, Izhar Halqi adalah membaca Nun sukun (نْ) atau Tanwin dengan jelas dan terang tanpa dengung ketika bertemu dengan salah satu dari 6 huruf halq (tenggorokan).

**Mengapa Disebut Halqi?**
Karena huruf-huruf Izhar keluar dari tenggorokan (halq), sehingga tidak bisa diidghamkan dengan Nun.

**Huruf Izhar Halqi ada 6:**
ء - ه - ع - ح - غ - خ
(Hamzah - Ha - 'Ain - Ha - Ghain - Kha)

Cara menghafal: أَخِي هَاكَ عِلْمًا حَازَهُ غَيْرُ خَاسِرٍ`,aturan:["Nun sukun atau Tanwin bertemu salah satu dari 6 huruf halq","Huruf Izhar: ء ه ع ح غ خ","Nun/Tanwin dibaca jelas tanpa dengung","Tidak ada idgham (peleburan)","Tidak ada ikhfa (samar)","Berlaku untuk Nun sukun dalam satu kata maupun dua kata","Berlaku untuk semua jenis Tanwin"],contoh:[{arab:"مِنْ أَهْلِ",latin:"Min ahli",penjelasan:"Nun sukun bertemu Hamzah, dibaca jelas"},{arab:"مَنْ هُوَ",latin:"Man huwa",penjelasan:"Nun sukun bertemu Ha, dibaca jelas"},{arab:"مِنْ عِلْمٍ",latin:"Min 'ilmin",penjelasan:"Nun sukun bertemu Ain, dibaca jelas"},{arab:"مَنْ حَادَّ",latin:"Man haadda",penjelasan:"Nun sukun bertemu Ha, dibaca jelas"},{arab:"مِنْ غَيْرِ",latin:"Min ghairi",penjelasan:"Nun sukun bertemu Ghain, dibaca jelas"},{arab:"مِنْ خَيْرٍ",latin:"Min khairin",penjelasan:"Nun sukun bertemu Kha, dibaca jelas"},{arab:"عَلِيمٌ حَكِيمٌ",latin:"'Alimun Hakimun",penjelasan:"Tanwin bertemu Ha, dibaca jelas"},{arab:"سَمِيعٌ عَلِيمٌ",latin:"Sami'un 'Alimun",penjelasan:"Tanwin bertemu Ain, dibaca jelas"}],rumus:`RUMUS MENCARI BACAAN IZHAR HALQI:

1. CARI Nun sukun (نْ) atau Tanwin (ـًـٍـٌ)
2. CEK huruf SETELAHNYA
3. Jika hurufnya salah satu dari: ء ه ع ح غ خ = IZHAR

HURUF IZHAR (6 huruf halq):
ء - Hamzah (contoh: مِنْ أَمْرِ)
ه - Ha (contoh: مِنْهُ)
ع - 'Ain (contoh: أَنْعَمْتَ)
ح - Ha (contoh: حِينَ حَانَ)
غ - Ghain (contoh: فَسَيُنْغِضُونَ)
خ - Kha (contoh: الْمُنْخَنِقَةُ)

CARA MENGHAFAL:
"أَخِي هَاكَ عِلْمًا حَازَهُ غَيْرُ خَاسِرٍ"
(Saudaraku, ambillah ilmu yang diraih oleh orang yang tidak rugi)

CARA MEMBACA: Jelas, terang, TANPA DENGUNG.`,kesimpulan:`Izhar Halqi adalah membaca Nun sukun atau Tanwin dengan jelas tanpa dengung ketika bertemu 6 huruf halq (tenggorokan): Hamzah, Ha, 'Ain, Ha, Ghain, Kha. Cara menghafal huruf-hurufnya dengan kalimat "Akhi haaka 'ilman haazahu ghairu khaasirin". Izhar berarti jelas, jadi bacaan harus terang dan tidak ada dengung.`},fk={id:"ikhfa",judul:"Bacaan Ikhfa'",pengertian:`**Pengertian Ikhfa':**
Ikhfa' (إِخْفَاء) secara bahasa berarti "menyamarkan" atau "menyembunyikan". Secara istilah, Ikhfa' Haqiqi adalah menyamarkan bunyi Nun sukun (نْ) atau Tanwin ketika bertemu dengan salah satu dari 15 huruf Ikhfa', disertai dengan dengung (ghunnah) selama 2 harakat.

**Huruf Ikhfa' ada 15:**
ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك
(Setelah dikurangi huruf Izhar, Idgham, dan Iqlab)

**Cara Membaca:**
Antara Izhar (jelas) dan Idgham (lebur), dengan suara samar dan dengung 2 harakat.`,aturan:["Nun sukun atau Tanwin bertemu salah satu dari 15 huruf Ikhfa","Huruf Ikhfa: ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك","Bunyi Nun/Tanwin disamarkan (tidak jelas, tidak hilang)","Disertai dengung (ghunnah) selama 2 harakat","Posisi lidah menyesuaikan huruf Ikhfa yang akan diucapkan","Berlaku dalam satu kata maupun dua kata"],contoh:[{arab:"أَنْتُمْ",latin:"Antum",penjelasan:"Nun sukun bertemu Ta, dibaca samar dengan dengung"},{arab:"مِنْ ثَمَرَةٍ",latin:"Min tsamaratin",penjelasan:"Nun sukun bertemu Tsa, dibaca samar dengan dengung"},{arab:"أَنْجَيْنَاكُمْ",latin:"Anjainakum",penjelasan:"Nun sukun bertemu Jim, dibaca samar dengan dengung"},{arab:"عِنْدَ",latin:"'Inda",penjelasan:"Nun sukun bertemu Dal, dibaca samar dengan dengung"},{arab:"مُنْذِرٌ",latin:"Mundzirun",penjelasan:"Nun sukun bertemu Dzal, dibaca samar dengan dengung"},{arab:"أَنْزَلْنَا",latin:"Anzalna",penjelasan:"Nun sukun bertemu Zai, dibaca samar dengan dengung"},{arab:"الْإِنْسَانُ",latin:"Al-Insanu",penjelasan:"Nun sukun bertemu Sin, dibaca samar dengan dengung"},{arab:"أَنْشَأَكُمْ",latin:"Ansya'akum",penjelasan:"Nun sukun bertemu Syin, dibaca samar dengan dengung"}],rumus:`RUMUS MENCARI BACAAN IKHFA':

1. CARI Nun sukun (نْ) atau Tanwin (ـًـٍـٌ)
2. CEK huruf SETELAHNYA
3. Jika hurufnya BUKAN huruf Izhar (6), BUKAN huruf Idgham (6), dan BUKAN Ba = IKHFA'

HURUF IKHFA' (15 huruf):
ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك

CARA MENGHAFAL dengan syair:
"صِفْ ذَا ثَنَا كَمْ جَادَ شَخْصٌ قَدْ سَمَا دُمْ طَيِّبًا زِدْ فِي تُقًى ضَعْ ظَالِمًا"

CARA MEMBACA:
- Suara SAMAR (antara jelas dan hilang)
- Dengan DENGUNG 2 harakat
- Lidah menyesuaikan posisi huruf Ikhfa'

TINGKATAN IKHFA':
1. Aqrab (paling dekat ke Idgham): د ت ط
2. Ausath (tengah-tengah): ث ج ذ ز س ش ص ض ظ ف
3. Ab'ad (paling dekat ke Izhar): ق ك`,kesimpulan:"Ikhfa' Haqiqi adalah menyamarkan bunyi Nun sukun atau Tanwin ketika bertemu 15 huruf Ikhfa', disertai dengung 2 harakat. Huruf-hurufnya adalah selain huruf Izhar (6), Idgham (6), dan Iqlab (1). Cara membacanya adalah dengan suara samar, tidak terlalu jelas dan tidak hilang, sambil berdengung. Ikhfa' adalah hukum tajwid yang paling banyak hurufnya."},kk={id:"idghom-bighunnah",judul:"Bacaan Idghom Bighunnah",pengertian:`**Pengertian Idghom:**
Idghom (إِدْغَام) secara bahasa berarti "memasukkan" atau "melebur". Secara istilah, Idghom adalah melebur bunyi Nun sukun (نْ) atau Tanwin ke dalam huruf setelahnya.

**Pengertian Idghom Bighunnah:**
Idghom Bighunnah (إِدْغَام بِغُنَّة) berarti Idghom dengan dengung. Yaitu melebur bunyi Nun sukun atau Tanwin ke dalam huruf setelahnya dengan disertai dengung (ghunnah) selama 2 harakat.

**Huruf Idghom Bighunnah ada 4:**
ي - ن - م - و
(Ya - Nun - Mim - Wau)

Cara menghafal: يَنْمُو (Yanmu) yang berarti "tumbuh"

**Syarat Idghom Bighunnah:**
- Nun sukun atau Tanwin harus berada di AKHIR kata
- Huruf Idghom harus berada di AWAL kata berikutnya
- Jika dalam satu kata, maka dibaca Izhar (bukan Idghom)`,aturan:["Nun sukun atau Tanwin bertemu salah satu dari 4 huruf: ي ن م و","Nun sukun/Tanwin harus di akhir kata, huruf Idghom di awal kata berikutnya","Bunyi Nun/Tanwin dilebur ke huruf berikutnya","Disertai dengung (ghunnah) selama 2 harakat","Jika dalam satu kata, hukumnya Izhar (contoh: دُنْيَا، بُنْيَانٌ)","Huruf Idghom dibaca dengan tasydid (dobel)","Disebut Idghom Naqish karena masih ada sisa bunyi (ghunnah)"],contoh:[{arab:"مَنْ يَقُولُ",latin:"May-yaqulu",penjelasan:'Nun sukun bertemu Ya, dibaca dengan dengung "may-yaqulu"'},{arab:"مِنْ نِعْمَةٍ",latin:"Min-ni'matin",penjelasan:`Nun sukun bertemu Nun, dibaca dengan dengung "min-ni'matin"`},{arab:"مِنْ مَاءٍ",latin:"Mim-maa'in",penjelasan:`Nun sukun bertemu Mim, dibaca dengan dengung "mim-maa'in"`},{arab:"مِنْ وَلِيٍّ",latin:"Miw-waliyyin",penjelasan:'Nun sukun bertemu Wau, dibaca dengan dengung "miw-waliyyin"'},{arab:"وَجْهٌ يَوْمَئِذٍ",latin:"Wajhuy-yaumai'idzin",penjelasan:"Tanwin bertemu Ya, dibaca dengan dengung"},{arab:"عَمَلٌ نَافِعٌ",latin:"'Amalun-naafi'un",penjelasan:"Tanwin bertemu Nun, dibaca dengan dengung"},{arab:"رَحْمَةٌ مِنْ رَبِّكَ",latin:"Rahmatun-min rabbik",penjelasan:"Tanwin bertemu Mim, dibaca dengan dengung"},{arab:"خَيْرٌ وَأَبْقَى",latin:"Khairuw-wa abqa",penjelasan:"Tanwin bertemu Wau, dibaca dengan dengung"}],rumus:`RUMUS MENCARI BACAAN IDGHOM BIGHUNNAH:

1. CARI Nun sukun (نْ) atau Tanwin (ـًـٍـٌ) di AKHIR KATA
2. CEK huruf PERTAMA kata berikutnya
3. Jika hurufnya: ي ن م و (YANMU) = IDGHOM BIGHUNNAH

CARA MENGHAFAL HURUF:
يَنْمُو (Yanmu) = "Tumbuh"
ي - Ya
ن - Nun
م - Mim
و - Wau

CARA MEMBACA:
- LEBUR bunyi Nun/Tanwin ke huruf berikutnya
- Dengan DENGUNG (ghunnah) 2 harakat
- Huruf setelahnya dibaca dobel (tasydid)

PENGECUALIAN:
- Jika Nun sukun dan huruf Yanmu dalam SATU KATA = IZHAR (bukan Idghom)
- Contoh: دُنْيَا (dun-ya), بُنْيَانٌ (bun-ya-nun)`,kesimpulan:'Idghom Bighunnah adalah melebur bunyi Nun sukun atau Tanwin ke dalam 4 huruf (Ya, Nun, Mim, Wau) dengan disertai dengung 2 harakat. Syaratnya Nun sukun/Tanwin harus di akhir kata dan huruf Idghom di awal kata berikutnya. Jika dalam satu kata, hukumnya adalah Izhar. Cara menghafal hurufnya dengan kata "Yanmu" (يَنْمُو) yang berarti tumbuh.'},ok={id:"idghom-bilaghunnah",judul:"Bacaan Idghom Bila Ghunnah",pengertian:`**Pengertian Idghom Bila Ghunnah:**
Idghom Bila Ghunnah (إِدْغَام بِلَا غُنَّة) berarti Idghom tanpa dengung. Yaitu melebur bunyi Nun sukun atau Tanwin ke dalam huruf setelahnya TANPA disertai dengung (ghunnah).

**Huruf Idghom Bila Ghunnah ada 2:**
ل - ر
(Lam - Ra)

**Perbedaan dengan Idghom Bighunnah:**
- Idghom Bighunnah (4 huruf): ADA dengung
- Idghom Bila Ghunnah (2 huruf): TIDAK ADA dengung

**Cara Membaca:**
Nun sukun/Tanwin langsung dilebur ke huruf Lam atau Ra tanpa ada bunyi dengung sama sekali. Disebut juga Idghom Kamil (sempurna) karena bunyi Nun/Tanwin hilang sepenuhnya.`,aturan:["Nun sukun atau Tanwin bertemu huruf Lam (ل) atau Ra (ر)","Nun sukun/Tanwin harus di akhir kata, huruf Lam/Ra di awal kata berikutnya","Bunyi Nun/Tanwin dilebur SEPENUHNYA ke huruf berikutnya","TIDAK ada dengung (ghunnah) sama sekali","Huruf Lam atau Ra dibaca dengan tasydid (dobel)","Disebut Idghom Kamil karena peleburan sempurna","Lebih mudah diucapkan karena tanpa harus berdengung"],contoh:[{arab:"مِنْ رَبِّهِمْ",latin:"Mir-rabbihim",penjelasan:'Nun sukun bertemu Ra, dibaca langsung "mir-rabbihim" tanpa dengung'},{arab:"مِنْ لَدُنْهُ",latin:"Mil-ladunhu",penjelasan:'Nun sukun bertemu Lam, dibaca langsung "mil-ladunhu" tanpa dengung'},{arab:"غَفُورٌ رَحِيمٌ",latin:"Ghafurur-rahimun",penjelasan:"Tanwin bertemu Ra, dibaca langsung tanpa dengung"},{arab:"ظِلٍّ لَهُمْ",latin:"Dzillil-lahum",penjelasan:"Tanwin bertemu Lam, dibaca langsung tanpa dengung"},{arab:"أَنْ لَا",latin:"Al-laa",penjelasan:'Nun sukun bertemu Lam, dibaca "al-laa" tanpa dengung'},{arab:"فَإِنْ لَمْ",latin:"Fa il-lam",penjelasan:"Nun sukun bertemu Lam, dibaca tanpa dengung"},{arab:"عَذَابٌ رَبِّكَ",latin:"'Adzabur-rabbika",penjelasan:"Tanwin bertemu Ra, dibaca langsung tanpa dengung"},{arab:"هُدًى لِلْمُتَّقِينَ",latin:"Hudal-lilmuttaqin",penjelasan:"Tanwin bertemu Lam, dibaca langsung tanpa dengung"}],rumus:`RUMUS MENCARI BACAAN IDGHOM BILA GHUNNAH:

1. CARI Nun sukun (نْ) atau Tanwin (ـًـٍـٌ) di AKHIR KATA
2. CEK huruf PERTAMA kata berikutnya
3. Jika hurufnya: ل (Lam) atau ر (Ra) = IDGHOM BILA GHUNNAH

CARA MENGHAFAL HURUF:
Hanya 2 huruf: لر (Lam dan Ra)

CARA MEMBACA:
- LEBUR SEPENUHNYA bunyi Nun/Tanwin ke huruf berikutnya
- TANPA DENGUNG sama sekali
- Huruf Lam/Ra dibaca dobel (tasydid)
- Langsung ucapkan huruf Lam/Ra dengan jelas

PERBEDAAN DENGAN IDGHOM BIGHUNNAH:
| Idghom Bighunnah | Idghom Bila Ghunnah |
|------------------|---------------------|
| 4 huruf (ينمو)   | 2 huruf (لر)        |
| Ada dengung      | Tidak ada dengung   |
| Idghom Naqish    | Idghom Kamil        |`,kesimpulan:"Idghom Bila Ghunnah adalah melebur bunyi Nun sukun atau Tanwin ke dalam 2 huruf (Lam dan Ra) tanpa disertai dengung. Ini berbeda dengan Idghom Bighunnah yang ada dengungnya. Disebut juga Idghom Kamil karena bunyi Nun/Tanwin hilang sepenuhnya. Cara membacanya langsung melebur ke huruf Lam atau Ra yang dibaca dobel (tasydid)."},yk=[{id:"belajar-quran-1",judul:"Keutamaan Belajar dan Mengajarkan Al-Quran",arab:"خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ وَعَلَّمَهُ",latin:"Khairukum man ta'allamal-Qur'ana wa 'allamahu",arti:"Sebaik-baik kalian adalah orang yang mempelajari Al-Quran dan mengajarkannya.",perawi:"HR. Bukhari no. 5027, dari Utsman bin Affan radhiyallahu 'anhu",kualitas:"Shahih",kosaKata:[{arab:"خَيْرُكُمْ",latin:"Khairukum",arti:"Sebaik-baik kalian"},{arab:"مَنْ",latin:"Man",arti:"Orang yang"},{arab:"تَعَلَّمَ",latin:"Ta'allama",arti:"Mempelajari"},{arab:"الْقُرْآنَ",latin:"Al-Qur'an",arti:"Al-Quran"},{arab:"عَلَّمَهُ",latin:"'Allamahu",arti:"Mengajarkannya"}],penjelasan:`Hadist ini diriwayatkan oleh Imam Bukhari dari sahabat Utsman bin Affan radhiyallahu 'anhu, yang dikenal sebagai khalifah yang sangat mencintai Al-Quran.

**Makna Hadist:**
Rasulullah SAW menyatakan bahwa orang terbaik di antara umatnya adalah mereka yang memiliki dua sifat:
1. **Ta'allama Al-Quran** - Mempelajari Al-Quran dengan sungguh-sungguh
2. **'Allamahu** - Mengajarkannya kepada orang lain

**Tingkatan Kebaikan:**
Para ulama menjelaskan bahwa kebaikan dalam hadist ini mencakup:
1. Belajar Al-Quran (membaca, memahami, menghafal)
2. Mengamalkan isi Al-Quran
3. Mengajarkan Al-Quran kepada orang lain

**Keutamaan Guru Al-Quran:**
Orang yang mengajarkan Al-Quran mendapat pahala yang berlipat ganda:
- Pahala mengajar
- Pahala membaca Al-Quran
- Pahala dari setiap orang yang ia ajar
- Pahala jariyah yang terus mengalir`,pelajaran:["Mempelajari Al-Quran adalah kebaikan yang sangat tinggi","Mengajarkan Al-Quran adalah kebaikan yang lebih tinggi lagi","Kombinasi belajar dan mengajar Al-Quran menjadikan seseorang yang terbaik","Ilmu yang bermanfaat adalah ilmu yang diamalkan dan diajarkan","Setiap Muslim wajib belajar Al-Quran minimal bisa membacanya","Menjadi guru Al-Quran adalah profesi yang sangat mulia","Hadist ini memotivasi untuk tidak berhenti belajar dan mengajar"],contohPengamalan:["Belajar membaca Al-Quran dengan guru yang ahli","Mengikuti program tahsin (perbaikan bacaan) Al-Quran","Menghafal Al-Quran sesuai kemampuan","Memahami makna dan tafsir Al-Quran","Mengajarkan Al-Quran kepada anak-anak","Membuka atau mendukung program TPA/TPQ","Menjadi relawan pengajar Al-Quran","Menggunakan aplikasi untuk belajar Al-Quran"],kesimpulan:"Hadist ini menegaskan bahwa sebaik-baik manusia adalah yang mempelajari Al-Quran dan mengajarkannya. Ini menunjukkan betapa tingginya kedudukan orang yang berinteraksi dengan Al-Quran, baik sebagai murid maupun sebagai guru. Setiap Muslim dianjurkan untuk terus belajar Al-Quran dan menyebarkan ilmunya."}],pk=[{id:"hormat-ortu-1",judul:"Ridha Allah dalam Ridha Orang Tua",arab:"رِضَا اللَّهِ فِي رِضَا الْوَالِدِ، وَسَخَطُ اللَّهِ فِي سَخَطِ الْوَالِدِ",latin:"Ridhallahi fi ridhal-walidi, wa sakhatullahi fi sakhatil-walidi",arti:"Ridha Allah tergantung pada ridha orang tua, dan murka Allah tergantung pada murka orang tua.",perawi:"HR. Tirmidzi no. 1899, dari Abdullah bin Amr radhiyallahu 'anhu",kualitas:"Shahih",kosaKata:[{arab:"رِضَا",latin:"Ridha",arti:"Keridhaan/kerelaan"},{arab:"اللَّهِ",latin:"Allah",arti:"Allah"},{arab:"الْوَالِدِ",latin:"Al-Walid",arti:"Orang tua"},{arab:"سَخَطُ",latin:"Sakhat",arti:"Kemurkaan"}],penjelasan:`Hadist ini diriwayatkan oleh Imam At-Tirmidzi dari sahabat Abdullah bin Amr radhiyallahu 'anhu.

**Makna Hadist:**
Hadist ini menjelaskan hubungan erat antara sikap terhadap orang tua dengan ridha dan murka Allah:
1. **Ridha Allah dalam ridha orang tua** - Jika orang tua ridha, Allah akan ridha
2. **Murka Allah dalam murka orang tua** - Jika orang tua murka, Allah juga murka

**Penjelasan Para Ulama:**
Para ulama menjelaskan bahwa:
- Berbakti kepada orang tua adalah jalan menuju ridha Allah
- Durhaka kepada orang tua menyebabkan murka Allah
- Ridha orang tua yang dimaksud adalah dalam hal yang tidak maksiat
- Orang tua di sini mencakup ayah dan ibu

**Kedudukan Berbakti kepada Orang Tua:**
- Perintah berbakti kepada orang tua disebutkan setelah perintah menyembah Allah
- Berbakti kepada orang tua termasuk amalan yang paling dicintai Allah
- Durhaka kepada orang tua termasuk dosa besar`,pelajaran:["Ridha orang tua adalah kunci untuk mendapatkan ridha Allah","Durhaka kepada orang tua menyebabkan murka Allah","Berbakti kepada orang tua adalah jalan menuju surga","Perintah berbakti berlaku untuk ayah dan ibu","Harus mencari ridha orang tua dalam semua hal yang tidak maksiat","Doa orang tua untuk anaknya sangat mustajab","Berbuat baik kepada orang tua harus dilakukan sekarang, selagi mereka masih hidup"],contohPengamalan:["Berbicara dengan lembut dan sopan kepada orang tua","Memenuhi kebutuhan orang tua baik materi maupun kasih sayang","Mendoakan orang tua setiap selesai shalat","Meminta izin dan restu dalam setiap keputusan penting","Tidak membantah atau membentak orang tua","Mengunjungi orang tua secara rutin jika tinggal terpisah","Memaafkan kesalahan orang tua dan tidak menyimpan dendam","Bersedekah atas nama orang tua yang sudah meninggal"],kesimpulan:"Hadist ini mengajarkan bahwa berbakti kepada orang tua adalah salah satu cara utama untuk mendapatkan ridha Allah. Sebaliknya, menyakiti atau mendurhakai orang tua akan mendatangkan murka Allah. Oleh karena itu, setiap Muslim harus berusaha maksimal untuk membuat orang tuanya ridha dalam hal-hal yang tidak bertentangan dengan syariat."}],jk=[{id:"sholat-jamaah-1",judul:"Keutamaan Shalat Berjamaah",arab:"صَلَاةُ الْجَمَاعَةِ أَفْضَلُ مِنْ صَلَاةِ الْفَذِّ بِسَبْعٍ وَعِشْرِينَ دَرَجَةً",latin:"Shalatil-jama'ati afdhalu min shalatil-fadzi bisab'in wa 'isyrina darajah",arti:"Shalat berjamaah lebih utama dari shalat sendirian dengan dua puluh tujuh derajat.",perawi:"HR. Bukhari no. 645 dan Muslim no. 650, dari Abdullah bin Umar radhiyallahu 'anhu",kualitas:"Muttafaq 'Alaih (Shahih)",kosaKata:[{arab:"صَلَاةُ",latin:"Shalat",arti:"Shalat"},{arab:"الْجَمَاعَةِ",latin:"Al-Jama'ah",arti:"Berjamaah"},{arab:"أَفْضَلُ",latin:"Afdhalu",arti:"Lebih utama"},{arab:"الْفَذِّ",latin:"Al-Fadzz",arti:"Sendirian"},{arab:"سَبْعٍ وَعِشْرِينَ",latin:"Sab'in wa 'isyrin",arti:"Dua puluh tujuh"},{arab:"دَرَجَةً",latin:"Darajah",arti:"Derajat"}],penjelasan:`Hadist ini diriwayatkan oleh Imam Bukhari dan Muslim dari sahabat Abdullah bin Umar radhiyallahu 'anhu.

**Makna Hadist:**
Shalat berjamaah memiliki keutamaan yang sangat besar, yaitu pahalanya 27 kali lipat dibandingkan shalat sendirian.

**Riwayat Lain:**
Dalam riwayat lain disebutkan 25 derajat. Para ulama menjelaskan:
- 27 derajat adalah keutamaan maksimal
- 25 derajat adalah keutamaan minimal
- Perbedaan tergantung pada kualitas jamaah dan kekhusyukan

**Hikmah Shalat Berjamaah:**
1. Memperkuat ukhuwah (persaudaraan) sesama Muslim
2. Menumbuhkan kedisiplinan dan ketaatan
3. Menyatukan barisan dan hati umat Islam
4. Mendapatkan pahala yang berlipat ganda
5. Terhindar dari sifat malas dan lalai dalam beribadah`,pelajaran:["Shalat berjamaah memiliki pahala 27 kali lipat dibanding shalat sendirian","Islam sangat menganjurkan shalat berjamaah di masjid","Shalat berjamaah memperkuat persatuan umat","Laki-laki dianjurkan keras untuk shalat berjamaah di masjid","Shalat berjamaah mengajarkan kedisiplinan waktu","Kebersamaan dalam shalat menumbuhkan rasa persaudaraan","Meninggalkan shalat berjamaah tanpa uzur adalah kerugian besar"],contohPengamalan:["Mengusahakan shalat lima waktu di masjid","Datang ke masjid sebelum adzan atau setelah adzan berkumandang","Mengajak keluarga dan teman untuk shalat berjamaah","Memakmurkan masjid di lingkungan tempat tinggal","Shalat berjamaah dengan keluarga di rumah jika tidak bisa ke masjid","Mengajarkan anak-anak pentingnya shalat berjamaah","Tidak meninggalkan shalat berjamaah kecuali ada uzur syar'i"],kesimpulan:"Hadist ini menegaskan keutamaan besar shalat berjamaah yang pahalanya 27 kali lipat dibanding shalat sendirian. Ini menunjukkan betapa Islam sangat menekankan kebersamaan dan persatuan umat dalam beribadah. Setiap Muslim, terutama laki-laki, dianjurkan untuk selalu mengupayakan shalat berjamaah di masjid."}],xk=[{id:"persaudaraan-1",judul:"Perumpamaan Persaudaraan Sesama Muslim",arab:"مَثَلُ الْمُؤْمِنِينَ فِي تَوَادِّهِمْ وَتَرَاحُمِهِمْ وَتَعَاطُفِهِمْ مَثَلُ الْجَسَدِ إِذَا اشْتَكَى مِنْهُ عُضْوٌ تَدَاعَى لَهُ سَائِرُ الْجَسَدِ بِالسَّهَرِ وَالْحُمَّى",latin:"Matsalul-mu'minina fi tawaddihim wa tarahumihim wa ta'athufihim matsalul-jasadi idza-sytaka minhu 'udhwun tada'a lahu sa'irul-jasadi bis-sahari wal-humma",arti:"Perumpamaan orang-orang mukmin dalam saling mencintai, saling menyayangi, dan saling berlemah lembut seperti satu tubuh. Apabila salah satu anggota tubuh sakit, maka seluruh tubuh ikut merasakan tidak bisa tidur dan demam.",perawi:"HR. Bukhari no. 6011 dan Muslim no. 2586, dari Nu'man bin Basyir radhiyallahu 'anhu",kualitas:"Muttafaq 'Alaih (Shahih)",kosaKata:[{arab:"مَثَلُ",latin:"Matsal",arti:"Perumpamaan"},{arab:"الْمُؤْمِنِينَ",latin:"Al-Mu'minin",arti:"Orang-orang mukmin"},{arab:"تَوَادِّهِمْ",latin:"Tawaddihim",arti:"Saling mencintai"},{arab:"تَرَاحُمِهِمْ",latin:"Tarahumihim",arti:"Saling menyayangi"},{arab:"تَعَاطُفِهِمْ",latin:"Ta'athufihim",arti:"Saling berlemah lembut"},{arab:"الْجَسَدِ",latin:"Al-Jasad",arti:"Tubuh"},{arab:"عُضْوٌ",latin:"'Udhw",arti:"Anggota tubuh"},{arab:"الْحُمَّى",latin:"Al-Humma",arti:"Demam"}],penjelasan:`Hadist ini diriwayatkan oleh Imam Bukhari dan Muslim dari sahabat Nu'man bin Basyir radhiyallahu 'anhu.

**Makna Hadist:**
Rasulullah SAW memberikan perumpamaan yang sangat indah tentang persaudaraan sesama Muslim:
1. **Tawadud** - Saling mencintai karena Allah
2. **Tarahum** - Saling menyayangi satu sama lain
3. **Ta'athuf** - Saling berlemah lembut dan empati

**Perumpamaan Satu Tubuh:**
Seperti satu tubuh yang terdiri dari banyak anggota:
- Jika satu bagian sakit, seluruh tubuh merasakan
- Tidak bisa tidur karena rasa sakit
- Demam yang menyebar ke seluruh tubuh

Demikian pula hubungan sesama Muslim, jika satu Muslim kesusahan, Muslim lainnya ikut merasakan dan membantu.`,pelajaran:["Umat Islam bagaikan satu tubuh yang utuh","Wajib saling mencintai, menyayangi, dan berlemah lembut","Jika ada Muslim yang kesusahan, harus ikut membantu","Persaudaraan Islam tidak mengenal batas negara dan suku","Rasa empati dan kepedulian adalah ciri mukmin sejati","Tidak boleh acuh terhadap penderitaan saudara Muslim","Kekuatan umat ada pada persatuan dan persaudaraan"],contohPengamalan:["Menjenguk saudara Muslim yang sakit","Membantu saudara yang terkena musibah","Menyantuni fakir miskin dan anak yatim","Mendoakan saudara Muslim yang kesusahan","Tidak menyebarkan permusuhan sesama Muslim","Memaafkan kesalahan saudara sesama Muslim","Berkontribusi dalam kegiatan sosial umat","Menyebarkan berita kebaikan, bukan keburukan saudara"],kesimpulan:"Hadist ini mengajarkan bahwa umat Islam adalah satu kesatuan seperti satu tubuh. Saling mencintai, menyayangi, dan berlemah lembut adalah kewajiban. Jika satu Muslim kesusahan, Muslim lainnya harus ikut merasakan dan membantu. Ini adalah nilai luhur persaudaraan dalam Islam yang harus terus dijaga dan diamalkan."}],Ak=[{id:"takwa-1",judul:"Tempat Takwa di dalam Hati",arab:"التَّقْوَى هَاهُنَا وَيُشِيرُ إِلَى صَدْرِهِ ثَلَاثَ مَرَّاتٍ",latin:"At-taqwa hahuna wa yusyiru ila shadrihi tsalasa marratin",arti:"Takwa itu di sini (seraya menunjuk dadanya tiga kali).",perawi:"HR. Muslim no. 2564, dari Abu Hurairah radhiyallahu 'anhu",kualitas:"Shahih",kosaKata:[{arab:"التَّقْوَى",latin:"At-Taqwa",arti:"Takwa/ketakutan kepada Allah"},{arab:"هَاهُنَا",latin:"Hahuna",arti:"Di sini"},{arab:"يُشِيرُ",latin:"Yusyiru",arti:"Menunjuk"},{arab:"صَدْرِهِ",latin:"Shadrihi",arti:"Dadanya"},{arab:"ثَلَاثَ",latin:"Tsalats",arti:"Tiga"},{arab:"مَرَّاتٍ",latin:"Marratin",arti:"Kali"}],penjelasan:`Hadist ini diriwayatkan oleh Imam Muslim dari Abu Hurairah radhiyallahu 'anhu. Hadist ini adalah bagian dari hadist yang lebih panjang tentang larangan meremehkan sesama Muslim.

**Makna Hadist:**
Rasulullah SAW menunjuk ke dadanya tiga kali untuk menegaskan bahwa takwa letaknya di dalam hati, bukan pada penampilan lahiriah.

**Pengertian Takwa:**
Secara bahasa, takwa berarti menjaga diri dari sesuatu yang dibenci. Secara istilah, takwa adalah:
1. Mengerjakan semua perintah Allah
2. Menjauhi semua larangan Allah
3. Takut akan azab Allah
4. Mengharap rahmat Allah

**Hati sebagai Pusat Takwa:**
Para ulama menjelaskan bahwa:
- Hati adalah pusat dari segala perbuatan
- Jika hati baik, seluruh perbuatan akan baik
- Jika hati rusak, seluruh perbuatan akan rusak
- Takwa yang sejati tercermin dari hati yang bersih`,pelajaran:["Takwa letaknya di dalam hati, bukan pada penampilan","Tidak boleh menilai ketakwaan seseorang dari luarnya saja","Hati adalah penentu baik buruknya perbuatan","Menjaga kesucian hati adalah kunci ketakwaan","Takwa mencakup lahir dan batin, tapi intinya di hati","Tidak boleh sombong merasa lebih takwa dari orang lain","Takwa yang sejati akan tercermin dalam perbuatan"],contohPengamalan:["Selalu introspeksi diri dan menjaga niat","Tidak menilai orang dari penampilan luarnya","Menjauhi sifat sombong dan riya","Membersihkan hati dari dengki dan hasad","Mengerjakan ibadah dengan ikhlas","Menjaga pandangan dan pendengaran dari hal haram","Selalu mengingat Allah dalam setiap keadaan","Tidak meremehkan amal kecil dan tidak menyepelekan dosa kecil"],kesimpulan:"Hadist ini mengajarkan bahwa takwa yang sejati letaknya di dalam hati, bukan pada penampilan lahiriah. Rasulullah SAW menunjuk dadanya tiga kali untuk menekankan hal ini. Oleh karena itu, setiap Muslim harus fokus membersihkan hatinya dan tidak menilai ketakwaan orang lain dari penampilan luarnya saja."}],vk=[{id:"niat-1",judul:"Segala Amal Tergantung pada Niat",arab:"إِنَّمَا الْأَعْمَالُ بِالنِّيَّاتِ وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى",latin:"Innamal-a'malu bin-niyyati wa innama likulli-mri'in ma nawa",arti:"Sesungguhnya setiap amal tergantung pada niatnya, dan sesungguhnya setiap orang akan mendapatkan sesuai dengan apa yang dia niatkan.",perawi:"HR. Bukhari no. 1 dan Muslim no. 1907, dari Umar bin Khattab radhiyallahu 'anhu",kualitas:"Muttafaq 'Alaih (Shahih)",kosaKata:[{arab:"إِنَّمَا",latin:"Innama",arti:"Sesungguhnya/hanyalah"},{arab:"الْأَعْمَالُ",latin:"Al-A'mal",arti:"Amal-amal perbuatan"},{arab:"النِّيَّاتِ",latin:"An-Niyyat",arti:"Niat-niat"},{arab:"امْرِئٍ",latin:"Imri'in",arti:"Seseorang"},{arab:"نَوَى",latin:"Nawa",arti:"Dia niatkan"}],penjelasan:`Hadist ini diriwayatkan oleh Imam Bukhari dan Muslim dari Amirul Mukminin Umar bin Khattab radhiyallahu 'anhu. Ini adalah hadist pertama dalam Shahih Bukhari dan termasuk hadist yang paling penting.

**Kedudukan Hadist:**
Para ulama menyatakan hadist ini termasuk hadist yang menjadi pokok/dasar dalam Islam:
- Imam Asy-Syafi'i: "Hadist ini mencakup sepertiga ilmu"
- Imam Ahmad: "Pokok Islam ada pada tiga hadist, salah satunya hadist niat"
- Para ulama menjadikannya pembuka kitab-kitab hadist

**Makna Hadist:**
1. Setiap amal perbuatan dinilai berdasarkan niatnya
2. Pahala atau dosa tergantung pada niat pelakunya
3. Amal yang sama bisa berbeda nilainya karena perbedaan niat
4. Niat ikhlas karena Allah adalah syarat diterimanya amal

**Contoh Penerapan:**
- Orang yang berhijrah karena Allah = dapat pahala hijrah
- Orang yang berhijrah karena dunia atau wanita = mendapat sesuai niatnya`,pelajaran:["Niat adalah penentu nilai sebuah amal","Amal yang sama bisa berbeda pahalanya tergantung niat","Niat yang ikhlas karena Allah adalah syarat diterimanya amal","Niat harus diperbaiki sebelum beramal","Setiap orang akan mendapat balasan sesuai niatnya","Amal duniawi bisa menjadi ibadah jika diniatkan dengan benar","Riya (pamer) dapat merusak amal karena niat yang tidak ikhlas"],contohPengamalan:["Meluruskan niat sebelum melakukan setiap amal","Berniat ikhlas karena Allah dalam beribadah","Menjadikan aktivitas sehari-hari sebagai ibadah dengan niat yang benar","Makan dan minum dengan niat untuk kuat beribadah","Bekerja dengan niat mencari nafkah halal dan memenuhi kewajiban","Belajar dengan niat mencari ilmu yang bermanfaat","Selalu memperbaiki dan memeriksa niat dalam hati"],kesimpulan:"Hadist ini adalah salah satu hadist terpenting dalam Islam yang mengajarkan bahwa nilai setiap amal tergantung pada niatnya. Amal yang secara lahir sama bisa berbeda pahalanya karena perbedaan niat. Setiap Muslim wajib meluruskan niat sebelum beramal dan memastikan niatnya ikhlas karena Allah semata. Hadist ini juga mengajarkan bahwa setiap aktivitas bisa menjadi ibadah jika diniatkan dengan benar."}],Sk="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjPYryxoUxqyRIrWLkqi-iiss1qJ4lLV2GCxVU9CztIr72jMEuQY_uhZqW7f6W3B6qPyeIx0Xudo2N-2ONum9QXx6PkB3Mqcawgll42jWpXjSk7GKqSVmCgYvD3h2CdqrhaHyV0y6he047FE2FwhBObL2HbUNhv-ZgiwEdTWAfrFcpfrw/s220/LOGO%20TBS.png",Tc=[{title:"Beranda",icon:"🏠",color:"gray",items:[{id:"home",label:"Halaman Utama",icon:"🏠"}]},{title:"Ilmu Tajwid",icon:"📚",color:"emerald",items:[{id:"hijaiyyah",label:"Huruf Hijaiyyah & Tanda Baca",icon:"✏️"},{id:"ghunnah",label:"Bacaan Ghunnah",icon:"🔊"},{id:"al-qamariyah-syamsiyah",label:"Al-Qamariyah & Al-Syamsiyah",icon:"🌙"},{id:"qalqalah",label:"Bacaan Qalqalah",icon:"💫"},{id:"mad-thabii",label:"Mad Thabi'i",icon:"📏"},{id:"iqlab",label:"Bac
